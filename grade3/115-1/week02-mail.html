<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數字投遞員｜第 2 週快手任務</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<body class="week02-no-login">
  <script src="navbar.js?v=20260907"></script>
  <main class="lesson-shell mail-shell">
    <header class="lesson-hero mail-hero">
      <div>
        <span class="week-label">第 02 週 · 快手任務</span>
        <h1>數字投遞員</h1>
        <p class="hero-line">找到信箱，點框再打字。沒有計時，不用比快；老師說收尾，就停下來。</p>
      </div>
    </header>

    <div class="lesson-route one-link">
      <a href="week02.html">← 回到本週課程</a>
    </div>

    <p id="boot-status" class="status-note" role="status">正在準備活動；若等候太久，請重新整理或告訴老師。</p>

    <section class="lesson-card bonus mail-card">
      <p class="section-label">完成後挑戰 · 提早完成再開</p>
      <h2>動物信箱</h2>
      <p>每個信箱都有自己的代碼。換一個信箱，也要重新點一下輸入框。</p>

      <div id="mail-lock-panel" class="lock-box">
        <p id="mail-lock" role="status">先回本週課程，完成三個主要活動，再來投遞。</p>
        <button id="mail-retry" class="secondary" type="button">重新確認進度</button>
      </div>

      <div id="mail-content" class="hidden">
        <p id="progress-status" class="status-note" role="status">快手任務已開放，今天不用登入 Google。</p>
        <div id="typing-levels-container"></div>
      </div>

      <p class="reference">課本 p.101、p.107、p.110；動物信箱為自編延伸。</p>
    </section>
  </main>
  <script type="module" src="week02-mail.js?v=20260909-mailbox-hint"></script>
