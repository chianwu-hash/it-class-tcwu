<!doctype html>
<html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex"><title>考古題・考前練功坊</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-author.css">
  <link rel="stylesheet" href="../../shared/quiz-student.css">
  <link rel="stylesheet" href="../../shared/quiz-theme.css?v=20261029-batch4">
  <link rel="stylesheet" href="../../shared/image-lightbox.css">
  <link rel="stylesheet" href="../../shared/quiz-past-style.css?v=20261030-past114">
</head><body class="quiz-skin quiz-student-page past-exam-page" data-grade="3">
  <script src="navbar.js?v=20261029-batch4" data-homework="true" data-quiz="true"></script>
  <main class="wrap student-wrap">
    <section id="quiz-lock" class="card"><h1>考古題</h1><h2>先登入，再開始練習</h2><p>請使用三年級名冊中的學生 Google 帳號。</p><p role="status" aria-live="polite"></p></section>
    <section id="quiz-content" hidden><div id="past-exam" class="past-exam-workspace">
      <header class="past-heading"><div><p class="eyebrow">考古題・原卷練習</p><h1 id="paper-title"></h1></div><a class="quiz-back-link" href="quiz-library.html#past-exams">← 返回選卷</a></header>
      <section class="overview" aria-label="作答進度"><div><strong id="score">正在讀取</strong><span id="progress"></span></div></section>
      <progress id="past-progress" class="past-progress" max="63" value="0" aria-label="已核對欄位"></progress>
      <div class="past-tools">
        <details><summary>選擇題組</summary><div id="steps" class="steps"></div></details>
        <details class="past-options"><summary>成績紀錄與重新作答</summary><div><section id="practice-progress" aria-label="歷次成績與葉片"></section><button id="restart">重新作答</button></div></details>
        <details class="past-rules"><summary>計分與葉片規則</summary><div><p id="paper-policy">正在讀取本卷計分規則。</p><p id="paper-exclusions"></p><p>可到<a href="../../my-tree.html?course=grade3-115-1">努力樹</a>查看達標成果。</p></div></details>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="workspace" aria-label="作答區"></section>
    </div></section>
  </main>
  <script type="module" src="../../shared/quiz-past-entry.mjs?v=20261030-past114"></script>
</body></html>
