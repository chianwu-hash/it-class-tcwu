<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>左鍵右鍵分清楚｜三年級資訊課 115-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background:
                radial-gradient(circle at 12% 12%, rgba(125, 211, 252, 0.48), transparent 28%),
                radial-gradient(circle at 84% 20%, rgba(253, 186, 116, 0.32), transparent 24%),
                linear-gradient(180deg, #eff6ff 0%, #ffffff 52%, #fff7ed 100%);
            color: #0f172a;
        }
        .game-shell {
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: calc(100vh - 74px);
        }
        .playfield {
            position: relative;
            min-height: 520px;
            overflow: hidden;
            border: 5px solid #bfdbfe;
            border-radius: 28px;
            background:
                linear-gradient(180deg, #dbeafe 0%, #f8fafc 66%, #ffedd5 66%, #fed7aa 100%);
            box-shadow: 0 20px 45px rgba(30, 64, 175, 0.14);
            cursor: crosshair;
            user-select: none;
            touch-action: manipulation;
        }
        .cloud {
            position: absolute;
            width: 140px;
            height: 42px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 35px -18px 0 5px rgba(255, 255, 255, 0.88), 76px -4px 0 1px rgba(255, 255, 255, 0.88);
            opacity: 0.88;
        }
        .target {
            position: absolute;
            display: grid;
            place-items: center;
            width: var(--target-size, 118px);
            height: var(--target-size, 118px);
            border: 6px solid #fff;
            border-radius: 999px;
            color: #fff;
            font-size: calc(var(--target-size, 118px) * 0.34);
            font-weight: 900;
            box-shadow: 0 16px 26px rgba(15, 23, 42, 0.22);
            transform: translate(-50%, -50%) scale(1);
            animation: popIn 0.18s ease-out, breathe 1.1s ease-in-out infinite;
        }
        .target.left {
            background: #0ea5e9;
        }
        .target.right {
            background: #f97316;
        }
        .target::after {
            content: "";
            position: absolute;
            inset: -16px;
            border: 4px dashed rgba(255, 255, 255, 0.9);
            border-radius: inherit;
        }
        .target.hit {
            animation: hitPop 0.28s ease-out forwards;
        }
        .spark {
            position: absolute;
            z-index: 8;
            transform: translate(-50%, -50%);
            color: #0f766e;
            font-size: 30px;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.85s ease-out forwards;
        }
        .shake {
            animation: shake 0.22s ease-in-out;
        }
        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.72); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 16px 26px rgba(15, 23, 42, 0.22); }
            50% { box-shadow: 0 18px 34px rgba(249, 115, 22, 0.3); }
        }
        @keyframes hitPop {
            to { transform: translate(-50%, -50%) scale(1.45); opacity: 0; }
        }
        @keyframes floatUp {
            from { transform: translate(-50%, -20%); opacity: 0; }
            12% { opacity: 1; }
            to { transform: translate(-50%, -130%); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            30% { transform: translateX(-8px); }
            70% { transform: translateX(8px); }
        }
    </style>
</head>
<body class="antialiased">

    <script src="mouse-practice-config.js?v=20260902"></script>
    <script>
        const playfield = document.getElementById("playfield");
        const target = document.getElementById("target");
        const passcodePanel = document.getElementById("passcode-panel");
        const passcodeDots = document.getElementById("passcode-dots");
        const passcodeFeedback = document.getElementById("passcode-feedback");
        const passcodeClear = document.getElementById("passcode-clear");
        const passcodeBackspace = document.getElementById("passcode-backspace");
        const startPanel = document.getElementById("start-panel");
        const finishPanel = document.getElementById("finish-panel");
        const startBtn = document.getElementById("start-btn");
        const restartBtn = document.getElementById("restart-btn");
        const scoreEl = document.getElementById("score");
        const timeEl = document.getElementById("time-left");
        const levelNumberEl = document.getElementById("level-number");
        const levelNameEl = document.getElementById("level-name");
        const levelHintEl = document.getElementById("level-hint");
        const levelProgressEl = document.getElementById("level-progress");
        const instructionCard = document.getElementById("instruction-card");
        const currentInstruction = document.getElementById("current-instruction");
        const feedbackEl = document.getElementById("feedback");
        const feedbackCard = document.getElementById("feedback-card");
        const finishTitle = document.getElementById("finish-title");
        const finishMessage = document.getElementById("finish-message");
        const confettiCanvas = document.getElementById("confetti-canvas");
        const confettiBurst = confetti.create(confettiCanvas, { resize: true, useWorker: true });

        const passcode = window.mousePracticeConfig.passcode;
        const passcodeSessionKey = window.mousePracticeConfig.sessionKey;
        const levels = [
            { name: "複習左鍵", hint: "藍色目標用左鍵。", size: 126, hits: 4, mode: "left", moving: false },
            { name: "認識右鍵", hint: "橘色目標用右鍵。", size: 126, hits: 4, mode: "right", moving: false },
            { name: "看顏色按", hint: "藍色左鍵，橘色右鍵。", size: 108, hits: 6, mode: "color", moving: false },
            { name: "看文字按", hint: "先看目標上寫左或右。", size: 94, hits: 6, mode: "text", moving: false },
            { name: "混合挑戰", hint: "目標會動，先看清楚再點。", size: 88, hits: 6, mode: "mixed", moving: true, speed: 1.7 }
        ];
        const encouragements = [
            "你有先看清楚再按。",
            "這一次分辨得很穩。",
            "你正在練習控制手指和滑鼠。",
            "很好，按一次就停下來。",
            "你有修正方法，越來越準了。"
        ];

        const totalTime = 85;
        let levelIndex = 0;
        let levelHits = 0;
        let totalHits = 0;
        let timeLeft = totalTime;
        let timer = null;
        let animationFrame = null;
        let running = false;
        let unlocked = false;
        let passcodeInput = "";
        let requiredButton = "left";
        let targetPosition = { x: 0, y: 0 };
        let targetVelocity = { x: 0, y: 0 };

        function setFeedback(text, tone = "cyan") {
            feedbackEl.textContent = text;
            feedbackCard.className = `min-h-[150px] rounded-2xl bg-white border-4 border-${tone}-200 p-5 shadow-sm`;
        }

        function setInstruction(button) {
            requiredButton = button;
            const isLeft = button === "left";
            currentInstruction.textContent = isLeft ? "左鍵" : "右鍵";
            instructionCard.className = `rounded-2xl bg-white border-4 border-${isLeft ? "blue" : "orange"}-200 p-5 shadow-sm`;
            currentInstruction.className = `text-4xl font-black text-${isLeft ? "blue" : "orange"}-800 leading-tight`;
        }

        function updateStats() {
            const level = levels[levelIndex];
            scoreEl.textContent = `${levelHits}/${level.hits}`;
            timeEl.textContent = timeLeft;
            levelNumberEl.textContent = levelIndex + 1;
            levelNameEl.textContent = level.name;
            levelHintEl.textContent = level.hint;
            levelProgressEl.innerHTML = levels.map((item, index) => {
                const stateClass = index < levelIndex
                    ? "bg-emerald-500 text-white border-emerald-500"
                    : index === levelIndex
                        ? "bg-orange-400 text-slate-950 border-orange-400"
                        : "bg-white text-slate-500 border-slate-200";
                const icon = index < levelIndex ? "fa-check" : index === levelIndex ? "fa-location-dot" : "fa-circle";
                return `<div class="grid h-10 place-items-center rounded-xl border-2 ${stateClass}" title="${item.name}"><i class="fa-solid ${icon}"></i></div>`;
            }).join("");
        }

        function randomBetween(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function renderPasscodeDots() {
            Array.from(passcodeDots.children).forEach((dot, index) => {
                dot.className = index < passcodeInput.length
                    ? "h-5 w-5 rounded-full bg-indigo-600"
                    : "h-5 w-5 rounded-full bg-slate-200";
            });
        }

        function resetPasscode(message = "等老師說密碼後，再慢慢點。", tone = "indigo") {
            passcodeInput = "";
            renderPasscodeDots();
            passcodeFeedback.textContent = message;
            passcodeFeedback.className = `mt-5 min-h-[32px] text-lg font-black text-${tone}-800`;
        }

        function unlockGame() {
            unlocked = true;
            if (passcodeSessionKey) {
                sessionStorage.setItem(passcodeSessionKey, passcode);
            }
            passcodePanel.classList.add("hidden");
            passcodePanel.classList.remove("grid");
            startPanel.classList.remove("hidden");
            startPanel.classList.add("grid");
            setFeedback("密碼正確。按開始後，先看清楚左鍵或右鍵。", "emerald");
        }

        function restoreUnlockedSession() {
            if (!passcodeSessionKey || sessionStorage.getItem(passcodeSessionKey) !== passcode) return;
            unlockGame();
        }

        function pressPasscodeKey(key) {
            if (unlocked) return;
            passcodeInput = `${passcodeInput}${key}`.slice(0, passcode.length);
            renderPasscodeDots();
            if (passcodeInput.length < passcode.length) {
                passcodeFeedback.textContent = "繼續看老師公布的密碼，慢慢點。";
                passcodeFeedback.className = "mt-5 min-h-[32px] text-lg font-black text-indigo-800";
                return;
            }
            if (passcodeInput === passcode) {
                passcodeFeedback.textContent = "密碼正確。";
                passcodeFeedback.className = "mt-5 min-h-[32px] text-lg font-black text-emerald-800";
                setTimeout(unlockGame, 180);
                return;
            }
            passcodePanel.firstElementChild.classList.add("shake");
            setTimeout(() => passcodePanel.firstElementChild.classList.remove("shake"), 260);
            setTimeout(() => resetPasscode("先確認老師公布的密碼，再慢慢點一次。", "rose"), 280);
        }

        function chooseButtonForLevel(level) {
            if (level.mode === "left") return "left";
            if (level.mode === "right") return "right";
            return Math.random() < 0.5 ? "left" : "right";
        }

        function renderTargetLabel(level, button) {
            if (level.mode === "left" || level.mode === "right" || level.mode === "text" || level.mode === "mixed") {
                return button === "left" ? "左" : "右";
            }
            return button === "left" ? '<i class="fa-solid fa-arrow-pointer"></i>' : '<i class="fa-solid fa-bars"></i>';
        }

        function moveTarget() {
            if (!running) return;
            const box = playfield.getBoundingClientRect();
            const level = levels[levelIndex];
            const button = chooseButtonForLevel(level);
            setInstruction(button);
            target.style.setProperty("--target-size", `${level.size}px`);
            target.className = `target ${button} hidden`;
            const margin = Math.max(level.size / 2 + 18, Math.min(98, box.width * 0.1));
            targetPosition = {
                x: randomBetween(margin, Math.max(margin, box.width - margin)),
                y: randomBetween(margin + 15, Math.max(margin + 15, box.height - margin - 20))
            };
            target.style.left = `${targetPosition.x}px`;
            target.style.top = `${targetPosition.y}px`;
            target.innerHTML = renderTargetLabel(level, button);
            if (level.moving) {
                const direction = Math.random() * Math.PI * 2;
                targetVelocity = {
                    x: Math.cos(direction) * level.speed,
                    y: Math.sin(direction) * level.speed
                };
            } else {
                targetVelocity = { x: 0, y: 0 };
            }
            target.classList.remove("hidden", "hit");
        }

        function animateTarget() {
            if (!running) return;
            const level = levels[levelIndex];
            if (level.moving && !target.classList.contains("hidden") && !target.classList.contains("hit")) {
                const box = playfield.getBoundingClientRect();
                const margin = level.size / 2 + 18;
                targetPosition.x += targetVelocity.x;
                targetPosition.y += targetVelocity.y;
                if (targetPosition.x < margin || targetPosition.x > box.width - margin) {
                    targetVelocity.x *= -1;
                    targetPosition.x = Math.max(margin, Math.min(box.width - margin, targetPosition.x));
                }
                if (targetPosition.y < margin || targetPosition.y > box.height - margin - 20) {
                    targetVelocity.y *= -1;
                    targetPosition.y = Math.max(margin, Math.min(box.height - margin - 20, targetPosition.y));
                }
                target.style.left = `${targetPosition.x}px`;
                target.style.top = `${targetPosition.y}px`;
            }
            animationFrame = requestAnimationFrame(animateTarget);
        }

        function addSpark(x, y, text) {
            const spark = document.createElement("div");
            spark.className = "spark";
            spark.style.left = `${x}px`;
            spark.style.top = `${y}px`;
            spark.textContent = text;
            playfield.appendChild(spark);
            setTimeout(() => spark.remove(), 900);
        }

        function finishGame(completed) {
            running = false;
            clearInterval(timer);
            timer = null;
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
            target.classList.add("hidden");
            finishPanel.classList.remove("hidden");
            finishPanel.classList.add("grid");
            currentInstruction.textContent = "完成";
            instructionCard.className = "rounded-2xl bg-white border-4 border-emerald-200 p-5 shadow-sm";
            currentInstruction.className = "text-4xl font-black text-emerald-800 leading-tight";
            finishTitle.textContent = completed ? "五關完成" : "時間到";
            finishMessage.textContent = completed
                ? "你有先看清楚，再分辨左鍵和右鍵，一關一關完成了。"
                : `你這次完成到第 ${levelIndex + 1} 關，總共點對 ${totalHits} 次。再試一次，先看清楚再按。`;
            if (completed) {
                confettiBurst({
                    particleCount: 100,
                    spread: 78,
                    origin: { y: 0.62 },
                    colors: ["#0ea5e9", "#f97316", "#22c55e", "#f59e0b"]
                });
            }
        }

        function completeLevel() {
            if (!running) return;
            confettiBurst({
                particleCount: 28,
                spread: 45,
                origin: { y: 0.7 },
                colors: ["#0ea5e9", "#f97316", "#22c55e"]
            });
            if (levelIndex >= levels.length - 1) {
                setTimeout(() => finishGame(true), 280);
                return;
            }
            const finishedLevelName = levels[levelIndex].name;
            levelIndex += 1;
            levelHits = 0;
            updateStats();
            target.classList.add("hidden");
            setFeedback(`你完成「${finishedLevelName}」。下一關：${levels[levelIndex].name}。`, "emerald");
            setTimeout(moveTarget, 850);
        }

        function startGame() {
            if (!unlocked) {
                setFeedback("請先用滑鼠點出老師公布的密碼。", "rose");
                return;
            }
            levelIndex = 0;
            levelHits = 0;
            totalHits = 0;
            timeLeft = totalTime;
            running = true;
            updateStats();
            startPanel.classList.add("hidden");
            finishPanel.classList.add("hidden");
            finishPanel.classList.remove("grid");
            setFeedback("先看清楚這一下要用左鍵還是右鍵。", "cyan");
            moveTarget();
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft -= 1;
                updateStats();
                if (timeLeft <= 0) finishGame(false);
            }, 1000);
            cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(animateTarget);
        }

        function handleAttempt(event, attemptedButton) {
            if (!running) return;
            event.preventDefault();
            if (attemptedButton !== requiredButton) {
                const expected = requiredButton === "left" ? "左鍵" : "右鍵";
                const actual = attemptedButton === "left" ? "左鍵" : "右鍵";
                setFeedback(`你按到${actual}。這一題要用${expected}點一下。`, "rose");
                feedbackCard.classList.add("shake");
                setTimeout(() => feedbackCard.classList.remove("shake"), 260);
                return;
            }
            levelHits += 1;
            totalHits += 1;
            updateStats();
            target.classList.add("hit");
            const box = playfield.getBoundingClientRect();
            addSpark(event.clientX - box.left, event.clientY - box.top, "+1");
            setFeedback(encouragements[totalHits % encouragements.length], "emerald");
            if (levelHits >= levels[levelIndex].hits) {
                setTimeout(completeLevel, 240);
                return;
            }
            setTimeout(moveTarget, 220);
        }

        target.addEventListener("pointerdown", (event) => {
            if (event.button === 0) handleAttempt(event, "left");
            if (event.button === 2) handleAttempt(event, "right");
        });

        playfield.addEventListener("contextmenu", (event) => event.preventDefault());
        playfield.addEventListener("pointerdown", (event) => {
            if (!running || event.target === target || target.contains(event.target)) return;
            if (event.button !== 0 && event.button !== 2) return;
            setFeedback("差一點。先移到目標上，再看清楚要按左鍵還是右鍵。", "amber");
        });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);
        document.querySelectorAll("[data-passcode-key]").forEach((button) => {
            button.addEventListener("click", () => pressPasscodeKey(button.dataset.passcodeKey));
        });
        passcodeClear.addEventListener("click", () => resetPasscode());
        passcodeBackspace.addEventListener("click", () => {
            passcodeInput = passcodeInput.slice(0, -1);
            renderPasscodeDots();
            passcodeFeedback.textContent = passcodeInput ? "退一格了，繼續慢慢點。" : "等老師說密碼後，再慢慢點。";
            passcodeFeedback.className = "mt-5 min-h-[32px] text-lg font-black text-indigo-800";
        });
        passcodePanel.addEventListener("contextmenu", (event) => event.preventDefault());
        setInstruction("left");
        renderPasscodeDots();
        restoreUnlockedSession();
        updateStats();
    </script>
</body>
</html>
