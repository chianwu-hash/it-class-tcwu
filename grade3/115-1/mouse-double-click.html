<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點兩下左鍵｜三年級資訊課 115-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background:
                radial-gradient(circle at 12% 14%, rgba(167, 139, 250, 0.32), transparent 28%),
                radial-gradient(circle at 86% 18%, rgba(125, 211, 252, 0.42), transparent 24%),
                linear-gradient(180deg, #f5f3ff 0%, #ffffff 52%, #ecfeff 100%);
            color: #0f172a;
        }
        .game-shell {
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: calc(100vh - 74px);
        }
        .playfield {
            position: relative;
            min-height: 520px;
            overflow: hidden;
            border: 5px solid #c4b5fd;
            border-radius: 28px;
            background:
                linear-gradient(180deg, #ede9fe 0%, #f8fafc 66%, #cffafe 66%, #a5f3fc 100%);
            box-shadow: 0 20px 45px rgba(91, 33, 182, 0.14);
            cursor: crosshair;
            user-select: none;
            touch-action: manipulation;
        }
        .target {
            position: absolute;
            display: grid;
            place-items: center;
            width: var(--target-size, 130px);
            height: var(--target-size, 130px);
            border: 6px solid #fff;
            border-radius: 24px;
            color: #fff;
            font-size: calc(var(--target-size, 130px) * 0.46);
            box-shadow: 0 16px 26px rgba(15, 23, 42, 0.22);
            transform: translate(-50%, -50%) scale(1);
            animation: popIn 0.18s ease-out, breathe 1.1s ease-in-out infinite;
        }
        .target.ready {
            outline: 8px solid rgba(250, 204, 21, 0.85);
            outline-offset: 8px;
        }
        .target.hit {
            animation: openPop 0.32s ease-out forwards;
        }
        .cloud {
            position: absolute;
            width: 140px;
            height: 42px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 35px -18px 0 5px rgba(255, 255, 255, 0.9), 76px -4px 0 1px rgba(255, 255, 255, 0.9);
            opacity: 0.86;
        }
        .desktop-icon {
            position: absolute;
            display: grid;
            place-items: center;
            width: 92px;
            height: 92px;
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 20px;
            color: #fff;
            font-size: 38px;
            box-shadow: 0 12px 20px rgba(15, 23, 42, 0.16);
            transform: translate(-50%, -50%);
        }
        .desktop-icon.target-icon {
            outline: 7px dashed rgba(250, 204, 21, 0.9);
            outline-offset: 8px;
        }
        .desktop-icon.ready,
        .mole-button.ready {
            outline: 9px solid rgba(34, 197, 94, 0.9);
            outline-offset: 7px;
            box-shadow: 0 0 0 10px rgba(187, 247, 208, 0.62), 0 14px 24px rgba(15, 23, 42, 0.2);
        }
        .desktop-icon.hit {
            animation: iconHit 0.26s ease-out forwards;
        }
        .mole-hole {
            position: absolute;
            display: grid;
            place-items: center;
            width: 128px;
            height: 104px;
            border-radius: 999px;
            background: radial-gradient(circle at 50% 72%, #475569 0 18%, #1e293b 19% 42%, rgba(15, 23, 42, 0.2) 43% 60%, transparent 61%);
            transform: translate(-50%, -50%);
        }
        .mole-sequence-badge {
            position: absolute;
            top: -24px;
            left: 50%;
            min-width: 84px;
            transform: translateX(-50%);
            border: 3px solid #fde68a;
            border-radius: 999px;
            background: #fffbeb;
            color: #92400e;
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
            padding: 7px 10px;
            text-align: center;
            box-shadow: 0 8px 14px rgba(146, 64, 14, 0.16);
        }
        .mole-wave-banner {
            position: absolute;
            z-index: 6;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid #fde68a;
            border-radius: 999px;
            background: rgba(255, 251, 235, 0.96);
            color: #7c2d12;
            font-size: 22px;
            font-weight: 900;
            padding: 10px 22px;
            box-shadow: 0 12px 24px rgba(124, 45, 18, 0.14);
            pointer-events: none;
        }
        .mole-button {
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            margin-bottom: 32px;
            border: 6px solid #fff;
            border-radius: 26px;
            background: linear-gradient(135deg, #f59e0b, #fb7185);
            color: #fff;
            font-size: 31px;
            box-shadow: 0 14px 22px rgba(15, 23, 42, 0.2);
            animation: molePop 0.7s ease-out, breathe 0.9s ease-in-out infinite;
        }
        .mole-button.target-icon {
            outline: 7px dashed rgba(250, 204, 21, 0.92);
            outline-offset: 6px;
        }
        .mole-button.hit {
            animation: moleHit 0.26s ease-out forwards;
        }
        .spark {
            position: absolute;
            z-index: 8;
            transform: translate(-50%, -50%);
            color: #6d28d9;
            font-size: 30px;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.85s ease-out forwards;
        }
        .shake { animation: shake 0.22s ease-in-out; }
        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.72); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 16px 26px rgba(15, 23, 42, 0.22); }
            50% { box-shadow: 0 18px 34px rgba(124, 58, 237, 0.3); }
        }
        @keyframes openPop {
            to { transform: translate(-50%, -50%) scale(1.42); opacity: 0; }
        }
        @keyframes molePop {
            from { transform: translateY(24px) scale(0.78); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes iconHit {
            to { transform: translate(-50%, -50%) scale(1.22); opacity: 0; }
        }
        @keyframes moleHit {
            to { transform: translateY(-6px) scale(1.18); opacity: 0; }
        }
        @keyframes floatUp {
            from { transform: translate(-50%, -20%); opacity: 0; }
            12% { opacity: 1; }
            to { transform: translate(-50%, -130%); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            30% { transform: translateX(-8px); }
            70% { transform: translateX(8px); }
        }
    </style>
</head>
<body class="antialiased">
    <script src="navbar.js?v=20260829"></script>
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-[80] w-full h-full"></canvas>

    <main class="game-shell max-w-6xl mx-auto px-4 md:px-6 py-6 gap-5">
        <header class="grid lg:grid-cols-[1fr_auto] gap-4 items-center">
            <div>
                <div class="inline-flex items-center gap-2 rounded-full bg-violet-100 text-violet-800 px-4 py-2 text-sm font-black mb-3">

                    滑鼠練習｜點兩下左鍵

            </div>
            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="rounded-2xl bg-white border-4 border-violet-200 px-4 py-3 shadow-sm">

        <section class="grid lg:grid-cols-[1fr_300px] gap-5 items-stretch">
            <div id="playfield" class="playfield" aria-label="點兩下左鍵練習區">

                </div>

                <div id="passcode-panel" class="absolute inset-0 z-20 grid place-items-center bg-white/80 backdrop-blur-sm px-5">
                    <div class="max-w-xl w-full text-center rounded-3xl bg-white border-4 border-indigo-200 p-7 shadow-xl">
                        <div class="mx-auto mb-4 grid h-20 w-20 place-items-center rounded-full bg-indigo-100 text-indigo-700 text-4xl">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h2 class="text-3xl md:text-4xl font-black text-slate-950 mb-3">等待老師公布密碼</h2>
                        <p class="text-lg md:text-xl font-bold text-slate-700 leading-relaxed mb-5">用滑鼠點數字。密碼正確後，才可以開始練習。</p>
                        <div id="passcode-dots" class="mb-5 flex justify-center gap-3" aria-label="已輸入密碼位數">
                            <span class="h-5 w-5 rounded-full bg-slate-200"></span>
                            <span class="h-5 w-5 rounded-full bg-slate-200"></span>
                            <span class="h-5 w-5 rounded-full bg-slate-200"></span>
                            <span class="h-5 w-5 rounded-full bg-slate-200"></span>
                        </div>
                        <div class="mx-auto grid max-w-sm grid-cols-3 gap-3">
                            <button type="button" data-passcode-key="1" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">1</button>
                            <button type="button" data-passcode-key="2" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">2</button>
                            <button type="button" data-passcode-key="3" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">3</button>
                            <button type="button" data-passcode-key="4" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">4</button>
                            <button type="button" data-passcode-key="5" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">5</button>
                            <button type="button" data-passcode-key="6" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">6</button>
                            <button type="button" data-passcode-key="7" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">7</button>
                            <button type="button" data-passcode-key="8" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">8</button>
                            <button type="button" data-passcode-key="9" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">9</button>
                            <button type="button" id="passcode-clear" class="min-h-[64px] rounded-2xl bg-slate-100 text-lg font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-200 transition">清除</button>
                            <button type="button" data-passcode-key="0" class="passcode-key min-h-[64px] rounded-2xl bg-white text-3xl font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-100 active:bg-indigo-100 transition">0</button>
                            <button type="button" id="passcode-backspace" class="min-h-[64px] rounded-2xl bg-slate-100 text-lg font-black text-slate-700 border-4 border-slate-200 hover:bg-slate-200 transition">退一格</button>
                        </div>
                        <p id="passcode-feedback" class="mt-5 min-h-[32px] text-lg font-black text-indigo-800">等老師說密碼後，再慢慢點。</p>
                    </div>
                </div>

                <div id="start-panel" class="hidden absolute inset-0 z-10 place-items-center bg-white/70 backdrop-blur-sm px-5">
                    <div class="max-w-xl text-center rounded-3xl bg-white border-4 border-violet-200 p-7 shadow-xl">

                        </div>
                        <h2 class="text-3xl md:text-4xl font-black text-slate-950 mb-3">準備練雙擊</h2>
                        <p class="text-lg md:text-xl font-bold text-slate-700 leading-relaxed mb-5">點一下後不要急著移開，在同一個目標上再點一下。</p>

                <div id="finish-panel" class="hidden absolute inset-0 z-10 place-items-center bg-white/75 backdrop-blur-sm px-5">

                        <h2 id="finish-title" class="text-3xl md:text-4xl font-black text-slate-950 mb-3">練習完成</h2>
                        <p id="finish-message" class="text-lg md:text-xl font-bold text-slate-700 leading-relaxed mb-5"></p>
                        <div class="grid sm:grid-cols-2 gap-3">

                                <i class="fa-solid fa-house mr-2"></i>回練習

                            <button id="restart-btn" type="button" class="min-h-[58px] rounded-2xl bg-emerald-600 px-6 text-xl font-black text-white shadow-lg hover:bg-emerald-500 transition">

            <aside class="grid gap-4 content-start">

                    <p id="level-hint" class="mt-2 text-base font-bold text-slate-600 leading-relaxed">大資料夾，連點兩下。</p>
                    <div id="level-progress" class="mt-4 grid grid-cols-5 gap-2" aria-label="關卡進度"></div>
                </div>
                <div id="feedback-card" class="min-h-[150px] rounded-2xl bg-white border-4 border-cyan-200 p-5 shadow-sm">
                    <div class="text-sm font-black text-cyan-700 mb-2">老師提醒</div>
                    <p id="feedback" class="text-xl font-black text-slate-800 leading-relaxed">先按開始，再在同一個目標點兩下。</p>

                <div class="rounded-2xl bg-white border-4 border-amber-200 p-5 shadow-sm">
                    <div class="text-sm font-black text-amber-700 mb-2">這關練什麼</div>
                    <ul class="space-y-3 text-lg font-bold text-slate-700">
                        <li><i class="fa-solid fa-check text-emerald-600 mr-2"></i>左鍵點兩下</li>
                        <li><i class="fa-solid fa-check text-emerald-600 mr-2"></i>不要移開</li>

    <script src="mouse-practice-config.js?v=20260902"></script>
    <script>
        const playfield = document.getElementById("playfield");
        const target = document.getElementById("target");
        const passcodePanel = document.getElementById("passcode-panel");
        const passcodeDots = document.getElementById("passcode-dots");
        const passcodeFeedback = document.getElementById("passcode-feedback");
        const passcodeClear = document.getElementById("passcode-clear");
        const passcodeBackspace = document.getElementById("passcode-backspace");
        const startPanel = document.getElementById("start-panel");
        const finishPanel = document.getElementById("finish-panel");
        const startBtn = document.getElementById("start-btn");
        const restartBtn = document.getElementById("restart-btn");
        const scoreEl = document.getElementById("score");
        const timeEl = document.getElementById("time-left");
        const levelNumberEl = document.getElementById("level-number");
        const levelNameEl = document.getElementById("level-name");
        const levelHintEl = document.getElementById("level-hint");
        const levelProgressEl = document.getElementById("level-progress");
        const feedbackEl = document.getElementById("feedback");
        const feedbackCard = document.getElementById("feedback-card");
        const finishTitle = document.getElementById("finish-title");
        const finishMessage = document.getElementById("finish-message");
        const confettiCanvas = document.getElementById("confetti-canvas");
        const confettiBurst = confetti.create(confettiCanvas, { resize: true, useWorker: true });

        const passcode = window.mousePracticeConfig.passcode;
        const passcodeSessionKey = window.mousePracticeConfig.sessionKey;
        const levels = [
            { name: "大圖示雙擊", hint: "大資料夾，連點兩下。", size: 138, hits: 3, maxGap: 850, maxMove: 46, mode: "single" },
            { name: "速度剛剛好", hint: "兩下靠近一點，不用用力。", size: 122, hits: 4, maxGap: 620, maxMove: 42, mode: "single" },
            { name: "不要移開", hint: "第一下後，滑鼠留在目標上。", size: 112, hits: 4, maxGap: 720, maxMove: 22, mode: "single" },
            { name: "指定圖示", hint: "只雙擊亮框的圖示。", size: 92, hits: 5, maxGap: 720, maxMove: 28, mode: "desktop" },
            { name: "打地鼠", hint: "目標冒出來時，對準點兩下。", size: 82, hits: 12, maxGap: 760, maxMove: 28, mode: "mole" }
        ];
        const moleStages = [
            { until: 3, visibleMs: 2800, sequenceCount: 1, staggerMs: 0, hint: "先慢慢來，看到一個目標就點兩下。" },
            { until: 6, visibleMs: 2600, sequenceCount: 1, staggerMs: 0, hint: "目標會換位置，先對準再連點。" },
            { until: 9, visibleMs: 2600, sequenceCount: 2, staggerMs: 520, hint: "接下來會連續冒出兩個，看到一個打一個。" },
            { until: 12, visibleMs: 2400, sequenceCount: 3, staggerMs: 480, hint: "最後會連續冒出三個，穩穩打中看到的目標。" }
        ];
        const icons = ["fa-folder", "fa-image", "fa-file", "fa-gamepad", "fa-star", "fa-book-open"];
        const colors = ["bg-violet-500", "bg-cyan-500", "bg-emerald-500", "bg-amber-500", "bg-rose-500"];
        const encouragements = [
            "你有在同一個地方點兩下。",
            "這次速度剛剛好。",
            "很好，第一下後手有停穩。",
            "你有先對準，再連點兩下。",
            "你正在掌握雙擊的方法。"
        ];

        const totalTime = 115;
        let levelIndex = 0;
        let levelHits = 0;
        let totalHits = 0;
        let timeLeft = totalTime;
        let timer = null;
        let running = false;
        let unlocked = false;
        let passcodeInput = "";
        let firstClick = null;
        let currentTargetId = "";
        let moleTimers = [];
        let activeTargetIds = new Set();
        let previousMoleIndexes = [];
        let currentMoleStageIndex = -1;
        let moleWaveAdvanceQueued = false;

        function setFeedback(text, tone = "cyan") {
            feedbackEl.textContent = text;
            feedbackCard.className = `min-h-[150px] rounded-2xl bg-white border-4 border-${tone}-200 p-5 shadow-sm`;
        }

        function updateStats() {
            const level = levels[levelIndex];
            scoreEl.textContent = `${levelHits}/${level.hits}`;
            timeEl.textContent = timeLeft;
            levelNumberEl.textContent = levelIndex + 1;
            levelNameEl.textContent = level.name;
            levelHintEl.textContent = level.hint;
            levelProgressEl.innerHTML = levels.map((item, index) => {
                const stateClass = index < levelIndex
                    ? "bg-emerald-500 text-white border-emerald-500"
                    : index === levelIndex
                        ? "bg-violet-400 text-slate-950 border-violet-400"
                        : "bg-white text-slate-500 border-slate-200";
                const icon = index < levelIndex ? "fa-check" : index === levelIndex ? "fa-location-dot" : "fa-circle";
                return `<div class="grid h-10 place-items-center rounded-xl border-2 ${stateClass}" title="${item.name}"><i class="fa-solid ${icon}"></i></div>`;
            }).join("");
        }

        function randomBetween(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function renderPasscodeDots() {
            Array.from(passcodeDots.children).forEach((dot, index) => {
                dot.className = index < passcodeInput.length
                    ? "h-5 w-5 rounded-full bg-indigo-600"
                    : "h-5 w-5 rounded-full bg-slate-200";
            });
        }

        function resetPasscode(message = "等老師說密碼後，再慢慢點。", tone = "indigo") {
            passcodeInput = "";
            renderPasscodeDots();
            passcodeFeedback.textContent = message;
            passcodeFeedback.className = `mt-5 min-h-[32px] text-lg font-black text-${tone}-800`;
        }

        function unlockGame() {
            unlocked = true;
            if (passcodeSessionKey) {
                sessionStorage.setItem(passcodeSessionKey, passcode);
            }
            passcodePanel.classList.add("hidden");
            passcodePanel.classList.remove("grid");
            startPanel.classList.remove("hidden");
            startPanel.classList.add("grid");
            setFeedback("密碼正確。按開始後，練習左鍵點兩下。", "emerald");
        }

        function restoreUnlockedSession() {
            if (!passcodeSessionKey || sessionStorage.getItem(passcodeSessionKey) !== passcode) return;
            unlockGame();
        }

        function pressPasscodeKey(key) {
            if (unlocked) return;
            passcodeInput = `${passcodeInput}${key}`.slice(0, passcode.length);
            renderPasscodeDots();
            if (passcodeInput.length < passcode.length) {
                passcodeFeedback.textContent = "繼續看老師公布的密碼，慢慢點。";
                passcodeFeedback.className = "mt-5 min-h-[32px] text-lg font-black text-indigo-800";
                return;
            }
            if (passcodeInput === passcode) {
                passcodeFeedback.textContent = "密碼正確。";
                passcodeFeedback.className = "mt-5 min-h-[32px] text-lg font-black text-emerald-800";
                setTimeout(unlockGame, 180);
                return;
            }
            passcodePanel.firstElementChild.classList.add("shake");
            setTimeout(() => passcodePanel.firstElementChild.classList.remove("shake"), 260);
            setTimeout(() => resetPasscode("先確認老師公布的密碼，再慢慢點一次。", "rose"), 280);
        }

        function clearMoleTimers() {
            moleTimers.forEach((timerId) => clearTimeout(timerId));
            moleTimers = [];
            moleWaveAdvanceQueued = false;
        }

        function queueMoleTimer(callback, delay) {
            const timerId = setTimeout(() => {
                moleTimers = moleTimers.filter((item) => item !== timerId);
                callback();
            }, delay);
            moleTimers.push(timerId);
        }

        function clearDesktopIcons() {
            clearMoleTimers();
            activeTargetIds = new Set();
            playfield.querySelectorAll(".desktop-icon, .mole-hole, .mole-wave-banner").forEach((icon) => icon.remove());
        }

        function renderSingleTarget() {
            clearDesktopIcons();
            const box = playfield.getBoundingClientRect();
            const level = levels[levelIndex];
            const margin = Math.max(level.size / 2 + 18, Math.min(100, box.width * 0.11));
            const x = randomBetween(margin, Math.max(margin, box.width - margin));
            const y = randomBetween(margin + 15, Math.max(margin + 15, box.height - margin - 20));
            currentTargetId = "main";
            firstClick = null;
            target.style.setProperty("--target-size", `${level.size}px`);
            target.className = `target ${colors[(totalHits + levelIndex) % colors.length]}`;
            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            target.innerHTML = `<i class="fa-solid ${icons[totalHits % icons.length]}"></i>`;
            target.classList.remove("hidden", "hit", "ready");
        }

        function renderDesktopTargets() {
            target.classList.add("hidden");
            clearDesktopIcons();
            firstClick = null;
            const box = playfield.getBoundingClientRect();
            const positions = [
                [0.22, 0.28], [0.48, 0.26], [0.74, 0.3],
                [0.32, 0.58], [0.62, 0.62]
            ];
            currentTargetId = `icon-${randomBetween(0, positions.length - 1)}`;
            positions.forEach(([rx, ry], index) => {
                const icon = document.createElement("div");
                const isTarget = `icon-${index}` === currentTargetId;
                icon.className = `desktop-icon ${colors[index % colors.length]} ${isTarget ? "target-icon" : ""}`;
                icon.dataset.targetId = `icon-${index}`;
                icon.style.left = `${box.width * rx}px`;
                icon.style.top = `${box.height * ry}px`;
                icon.innerHTML = `<i class="fa-solid ${icons[index % icons.length]}"></i>`;
                icon.addEventListener("pointerdown", (event) => handleAttempt(event, isTarget));
                playfield.appendChild(icon);
            });
            setFeedback("只雙擊有亮亮框的圖示。", "cyan");
        }

        function getMoleStageIndex() {
            const stageIndex = moleStages.findIndex((item) => levelHits < item.until);
            return stageIndex === -1 ? moleStages.length - 1 : stageIndex;
        }

        function queueNextMoleWave(delay = 520) {
            if (!running || levels[levelIndex].mode !== "mole" || moleWaveAdvanceQueued) return;
            moleWaveAdvanceQueued = true;
            queueMoleTimer(() => {
                moleWaveAdvanceQueued = false;
                if (!running || levels[levelIndex].mode !== "mole") return;
                renderMoleTargets();
            }, delay);
        }

        function spawnMoleTarget(hole, targetId, sequenceNumber, sequenceCount, visibleMs) {
            if (!running || levels[levelIndex].mode !== "mole" || !activeTargetIds.has(targetId)) return;
            if (sequenceCount > 1) {
                const badge = document.createElement("div");
                badge.className = "mole-sequence-badge";
                badge.textContent = `${sequenceNumber}/${sequenceCount}`;
                hole.appendChild(badge);
            }
            const button = document.createElement("div");
            button.className = "mole-button target-icon";
            button.dataset.targetId = targetId;
            button.innerHTML = '<i class="fa-solid fa-computer-mouse"></i>';
            button.addEventListener("pointerdown", (event) => handleAttempt(event, true));
            hole.appendChild(button);
            queueMoleTimer(() => {
                if (!button.isConnected || !activeTargetIds.has(targetId)) return;
                if (firstClick?.targetId === targetId) firstClick = null;
                activeTargetIds.delete(targetId);
                button.parentElement?.querySelector(".mole-sequence-badge")?.remove();
                button.remove();
                if (activeTargetIds.size === 0) queueNextMoleWave(420);
            }, visibleMs);
        }

        function renderMoleTargets() {
            target.classList.add("hidden");
            clearDesktopIcons();
            firstClick = null;
            const box = playfield.getBoundingClientRect();
            const stageIndex = getMoleStageIndex();
            const stage = moleStages[stageIndex];
            if (currentMoleStageIndex !== stageIndex) {
                currentMoleStageIndex = stageIndex;
            }
            if (stage.sequenceCount > 1) {
                const banner = document.createElement("div");
                banner.className = "mole-wave-banner";
                banner.textContent = `連續目標 ${Array.from({ length: stage.sequenceCount }, (_, index) => index + 1).join("→")}`;
                playfield.appendChild(banner);
            }
            const positions = [
                [0.2, 0.28], [0.5, 0.24], [0.8, 0.3],
                [0.28, 0.62], [0.58, 0.58], [0.82, 0.66]
            ];
            const availableIndexes = positions.map((_, index) => index);
            let activeIndexes = [];
            for (let attempt = 0; attempt < 8; attempt += 1) {
                const choices = [...availableIndexes];
                activeIndexes = [];
                while (activeIndexes.length < stage.sequenceCount && choices.length) {
                    activeIndexes.push(choices.splice(randomBetween(0, choices.length - 1), 1)[0]);
                }
                const sameAsPrevious = activeIndexes.length === previousMoleIndexes.length
                    && activeIndexes.every((index) => previousMoleIndexes.includes(index));
                if (!sameAsPrevious || attempt === 7) break;
            }
            previousMoleIndexes = [...activeIndexes];
            activeTargetIds = new Set(activeIndexes.map((index) => `mole-${index}`));
            currentTargetId = activeIndexes.map((index) => `mole-${index}`).join(",");
            positions.forEach(([rx, ry], index) => {
                const hole = document.createElement("div");
                const targetId = `mole-${index}`;
                hole.className = "mole-hole";
                hole.dataset.moleHole = targetId;
                hole.style.left = `${box.width * rx}px`;
                hole.style.top = `${box.height * ry}px`;
                hole.addEventListener("pointerdown", (event) => handleAttempt(event, false));
                playfield.appendChild(hole);
            });
            activeIndexes.forEach((index, order) => {
                const hole = playfield.querySelector(`[data-mole-hole="mole-${index}"]`);
                queueMoleTimer(() => {
                    spawnMoleTarget(hole, `mole-${index}`, order + 1, stage.sequenceCount, stage.visibleMs);
                }, order * stage.staggerMs);
            });
            const sequenceHint = stage.sequenceCount > 1
                ? `${stage.hint} 下一個會在前一個還沒完全結束時接著冒出。`
                : stage.hint;
            setFeedback(sequenceHint, "cyan");
        }

        function moveTarget() {
            if (!running) return;
            if (levels[levelIndex].mode === "mole") {
                renderMoleTargets();
                return;
            }
            if (levels[levelIndex].mode === "desktop") {
                renderDesktopTargets();
                return;
            }
            renderSingleTarget();
        }

        function addSpark(x, y, text) {
            const spark = document.createElement("div");
            spark.className = "spark";
            spark.style.left = `${x}px`;
            spark.style.top = `${y}px`;
            spark.textContent = text;
            playfield.appendChild(spark);
            setTimeout(() => spark.remove(), 900);
        }

        function finishGame(completed) {
            running = false;
            clearInterval(timer);
            clearMoleTimers();
            timer = null;
            firstClick = null;
            target.classList.add("hidden");
            clearDesktopIcons();
            finishPanel.classList.remove("hidden");
            finishPanel.classList.add("grid");
            finishTitle.textContent = completed ? "五關完成" : "時間到";
            finishMessage.textContent = completed
                ? "你有控制速度，也有停在同一個目標上，雙擊練習完成。"
                : `你這次完成到第 ${levelIndex + 1} 關，總共成功雙擊 ${totalHits} 次。再試一次，先停穩再點兩下。`;
            if (completed) {
                confettiBurst({
                    particleCount: 100,
                    spread: 78,
                    origin: { y: 0.62 },
                    colors: ["#8b5cf6", "#0ea5e9", "#22c55e", "#f59e0b"]
                });
            }
        }

        function completeLevel() {
            if (!running) return;
            clearMoleTimers();
            confettiBurst({
                particleCount: 28,
                spread: 45,
                origin: { y: 0.7 },
                colors: ["#8b5cf6", "#0ea5e9", "#22c55e"]
            });
            if (levelIndex >= levels.length - 1) {
                setTimeout(() => finishGame(true), 280);
                return;
            }
            const finishedLevelName = levels[levelIndex].name;
            levelIndex += 1;
            levelHits = 0;
            firstClick = null;
            currentMoleStageIndex = -1;
            updateStats();
            target.classList.add("hidden");
            clearDesktopIcons();
            setFeedback(`你完成「${finishedLevelName}」。下一關：${levels[levelIndex].name}。`, "emerald");
            setTimeout(moveTarget, 500);
        }

        function startGame() {
            if (!unlocked) {
                setFeedback("請先用滑鼠點出老師公布的密碼。", "rose");
                return;
            }
            levelIndex = 0;
            levelHits = 0;
            totalHits = 0;
            timeLeft = totalTime;
            running = true;
            firstClick = null;
            previousMoleIndexes = [];
            currentMoleStageIndex = -1;
            updateStats();
            startPanel.classList.add("hidden");
            finishPanel.classList.add("hidden");
            finishPanel.classList.remove("grid");
            setFeedback("左鍵點一下後，留在同一個目標，再點一下。", "cyan");
            moveTarget();
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft -= 1;
                updateStats();
                if (timeLeft <= 0) finishGame(false);
            }, 1000);
        }

        function markSuccess(event) {
            const wasMole = levels[levelIndex].mode === "mole";
            if (!wasMole) {
                clearMoleTimers();
            }
            const attemptTargetId = event.currentTarget.dataset.targetId || currentTargetId;
            const hitElement = event.currentTarget;
            levelHits += 1;
            totalHits += 1;
            updateStats();
            const box = playfield.getBoundingClientRect();
            addSpark(event.clientX - box.left, event.clientY - box.top, "打開了");
            setFeedback(encouragements[totalHits % encouragements.length], "emerald");
            if (hitElement === target) {
                target.classList.add("hit");
            } else {
                activeTargetIds.delete(attemptTargetId);
                hitElement.classList.add("hit");
                setTimeout(() => {
                    hitElement.parentElement?.querySelector(".mole-sequence-badge")?.remove();
                    hitElement.remove();
                }, 230);
            }
            firstClick = null;
            if (levelHits >= levels[levelIndex].hits) {
                clearMoleTimers();
                setTimeout(completeLevel, 240);
                return;
            }
            if (wasMole) {
                const nextMoleStageIndex = getMoleStageIndex();
                if (nextMoleStageIndex !== currentMoleStageIndex) {
                    clearMoleTimers();
                    currentMoleStageIndex = -1;
                    setTimeout(moveTarget, 420);
                    return;
                }
                if (activeTargetIds.size === 0) queueNextMoleWave(420);
                return;
            }
            setTimeout(moveTarget, 260);
        }

        function handleAttempt(event, isCorrectTarget) {
            if (!running) return;
            event.preventDefault();
            event.stopPropagation();
            const attemptTargetId = event.currentTarget.dataset.targetId || currentTargetId;

            function startFirstClick(message, tone = "cyan") {
                firstClick = { time: performance.now(), x: event.clientX, y: event.clientY, targetId: attemptTargetId };
                target.classList.remove("ready");
                playfield.querySelectorAll(".desktop-icon.ready, .mole-button.ready").forEach((item) => item.classList.remove("ready"));
                event.currentTarget.classList.add("ready");
                setFeedback(message, tone);
            }

            if (event.button !== 0) {
                firstClick = null;
                setFeedback("這一關練左鍵點兩下，先不用右鍵。", "rose");
                feedbackCard.classList.add("shake");
                setTimeout(() => feedbackCard.classList.remove("shake"), 260);
                return;
            }
            if (!isCorrectTarget) {
                firstClick = null;
                setFeedback("先找亮亮框的圖示，再點兩下。", "amber");
                return;
            }

            const level = levels[levelIndex];
            const now = performance.now();
            if (!firstClick) {
                startFirstClick("很好，滑鼠不要移開，再點同一個目標一下。");
                return;
            }

            const elapsed = now - firstClick.time;
            const moved = Math.hypot(event.clientX - firstClick.x, event.clientY - firstClick.y);
            const sameTarget = firstClick.targetId === attemptTargetId;
            if (elapsed > level.maxGap) {
                startFirstClick("剛剛隔太久了。這一下重新當第一下，再點同一個目標一下。", "amber");
                return;
            }
            if (!sameTarget || moved > level.maxMove) {
                startFirstClick("剛剛移太遠了。這一下重新當第一下，手先停穩。", "amber");
                return;
            }

            markSuccess(event);
        }

        target.addEventListener("pointerdown", (event) => handleAttempt(event, true));
        playfield.addEventListener("contextmenu", (event) => event.preventDefault());
        playfield.addEventListener("pointerdown", (event) => {
            if (!running || event.target === target || target.contains(event.target) || event.target.closest(".desktop-icon, .mole-hole")) return;
            firstClick = null;
            setFeedback("差一點。先移到目標上，再左鍵點兩下。", "amber");
        });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);
        document.querySelectorAll("[data-passcode-key]").forEach((button) => {
            button.addEventListener("click", () => pressPasscodeKey(button.dataset.passcodeKey));
        });
        passcodeClear.addEventListener("click", () => resetPasscode());
        passcodeBackspace.addEventListener("click", () => {
            passcodeInput = passcodeInput.slice(0, -1);
            renderPasscodeDots();
            passcodeFeedback.textContent = passcodeInput ? "退一格了，繼續慢慢點。" : "等老師說密碼後，再慢慢點。";
            passcodeFeedback.className = "mt-5 min-h-[32px] text-lg font-black text-indigo-800";
        });
        passcodePanel.addEventListener("contextmenu", (event) => event.preventDefault());
        renderPasscodeDots();
        restoreUnlockedSession();
        updateStats();
    </script>
</body>
</html>
