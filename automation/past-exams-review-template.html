<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考古題疑義・教師審閱</title>
<style>
:root{font:17px/1.65 system-ui,"Microsoft JhengHei",sans-serif;color:#193b48;background:#eff7f8;--teal:#0f766e;--line:#c7dce3}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1350px;margin:auto;padding:24px}h1{font-size:29px;line-height:1.3;margin:8px 0 14px}h2{font-size:22px;margin:10px 0}h3{font-size:18px;margin:12px 0 6px}p{margin:8px 0}.muted{color:#58717c}.small{font-size:14px}.hero{display:flex;gap:24px;align-items:flex-start;justify-content:space-between}.actions{display:flex;gap:10px;flex-wrap:wrap}button,select,input,textarea{font:inherit}button,select,input{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:white;color:#193b48}button{cursor:pointer}button:hover{border-color:var(--teal)}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}.primary{background:var(--teal);color:white;border-color:var(--teal)}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.stat{background:#f1f8fa;padding:10px 18px;border-radius:12px}.stat b{font-size:24px;margin-right:5px}.toolbar{position:sticky;top:0;background:#eff7f8f5;backdrop-filter:blur(8px);z-index:2;border-bottom:1px solid var(--line)}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding-top:16px;padding-bottom:16px}.filters label{font-size:14px;display:grid;gap:4px}.filters input{min-width:250px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button[aria-pressed=true]{background:#195d78;color:white;border-color:#195d78}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 5px 16px #254b5d08;scroll-margin-top:170px}.tag{display:inline-block;background:#e7f3f6;border-radius:7px;padding:3px 9px;font-size:14px;margin-right:8px}.priority{background:#fff1e7;color:#8a3e13}.reason{padding:14px 18px;border-left:4px solid #e4a265;background:#fff9ef;white-space:pre-wrap}.ask{font-weight:650}.twocol{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}.question{padding:14px;background:#f6f9fb;border:1px solid #e1ebef;border-radius:12px;margin:12px 0}.answer{background:#eef7f0;border-color:#c6dec9}.text{white-space:pre-wrap;overflow-wrap:anywhere}.material{border-left:3px solid #9abecb;padding-left:12px;white-space:pre-wrap;margin-bottom:12px}.choices{list-style:none;padding:0;margin:12px 0}.choices li{padding:5px 0}.figures{display:flex;gap:12px;flex-wrap:wrap}.figures img{max-width:100%;max-height:300px;object-fit:contain;border:1px solid #dde8ed;background:white}.choice-img{max-width:170px;max-height:140px;vertical-align:middle}summary{cursor:pointer;color:#146479;padding:8px 0;font-weight:600}details{margin-top:10px}a{color:#12617a}a:hover{text-decoration-thickness:2px}.pages{display:grid;grid-template-columns:1fr 1fr;gap:16px}.page{min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f5fafb}.page img{display:block;width:100%;height:auto;margin-top:8px;border:1px solid #d6e3e9}.decision{margin-top:20px;padding:16px;background:#f4f0fa;border-radius:12px}.decision label{display:block}.decision select{max-width:100%;margin:6px 0 12px}.decision textarea{display:block;width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.foot{font-size:14px;color:#58717c;padding-bottom:30px}code{font-size:13px;word-break:break-all}.hidden{display:none!important}#empty{padding:30px;background:white;border-radius:16px}dialog{max-width:min(98vw,1550px);max-height:96vh;border:1px solid var(--line);border-radius:14px;padding:16px}dialog::backdrop{background:#092e41bb}.dialogbar{position:sticky;top:0;background:white;display:flex;gap:12px;justify-content:space-between;align-items:center}#zoomFrame{overflow:auto;max-height:82vh}#zoomImage{display:block;max-width:none;width:100%;height:auto}.nowrap{white-space:nowrap}@media(max-width:700px){.wrap{padding:16px}.hero{display:block}h1{font-size:25px}.actions{margin-top:16px}.filters{gap:8px}.filters input{min-width:0;width:100%}.filters label:last-child{width:100%}.card{padding:16px;scroll-margin-top:260px}.twocol,.pages{grid-template-columns:1fr}.stat{padding:8px 12px}.stat b{font-size:22px}.tabs button{font-size:14px;padding:9px}.toolbar{position:relative}.dialogbar{flex-wrap:wrap}}@media print{.toolbar,.decision,.actions,.dialogbar{display:none}body{background:white}.card{break-inside:avoid;box-shadow:none}.wrap{max-width:none}.pages{grid-template-columns:1fr 1fr}details:not([open]){display:none}}
</style></head><body>
<header><div class="wrap"><div class="hero"><div><div class="muted small">考前練功坊 · 教師本機審閱</div><h1>考古題有疑義的題目，一起確認</h1><p id="scope"></p><p class="muted">原題與官方解答分開呈現；原頁可放大、旋轉，或開啟PDF核對。確認後再由我依你的指示修正。</p></div><div class="actions"><button class="primary" id="export">匯出確認紀錄（Markdown）</button><button id="exportJson">匯出確認資料（JSON）</button><label class="small">讀回已匯出的JSON <input id="import" type="file" accept="application/json,.json" style="display:block;max-width:250px"></label></div></div><div class="summary"><div class="stat"><b>14</b>非聽力暫停欄位</div><div class="stat"><b>84</b>缺原音聽力欄位</div><div class="stat"><b>20</b>已開放期中卷</div></div><p class="small muted">這是來源與發布版本的審閱快照。官方留白／不完整參考的開放題另列，沒有全部停用。頁面不修改正式資料；輸入只留在目前頁面，離開前請匯出保存。</p></div></header>
<section class="toolbar"><div class="wrap filters"><label>學年度<select id="year"><option value="">全部學年</option><option>113-1</option><option>114-1</option></select></label><label>年級<select id="grade"><option value="">全部年級</option><option value="3">三年級</option><option value="6">六年級</option></select></label><label>科目<select id="subject"><option value="">全部科目</option></select></label><label>搜尋題目／官方答案／編號<input id="search" type="search" placeholder="例如：浮力、9046、P01"></label></div></section>
<main class="wrap"><div class="tabs" id="tabs" aria-label="審閱類型"></div><div class="actions"><button id="pending">只看尚未填確認結果</button><button id="resetFilters">清除篩選</button></div><p id="count" role="status" aria-live="polite"></p><p class="small muted">可直接在對話回覆：<strong>P01 正解為…；P02 維持暫停；C01 …</strong>。缺音檔區每卷合併一組，但每一欄原題及官方記號均保留。</p><div id="cards"></div><div id="empty" hidden>目前篩選沒有符合的項目。</div><details><summary>20份試卷的版本與原始檔案</summary><div id="sources"></div></details><p id="snapshot" class="foot"></p></main>
<dialog id="zoom"><div class="dialogbar"><strong id="zoomTitle"></strong><div class="actions"><button id="zoomIn">放大</button><button id="zoomOut">縮小</button><button id="rotate">旋轉90°</button><button id="closeZoom">關閉</button></div></div><div id="zoomFrame"><div id="zoomStage" style="position:relative"><img id="zoomImage" style="position:absolute;left:0;top:0;transform-origin:0 0" alt="原始頁面放大檢視"></div></div></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('review-data').textContent),byId=new Map(DATA.cards.map(c=>[c.id,c])),decisions=new Map(),categories=['暫停・待確認','其他待覆核','缺少原音','參考答案','校對歷程'];let selected='暫停・待確認',pendingOnly=false,dirty=false;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),a=(url,text)=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
$('scope').textContent=DATA.scope;$('snapshot').textContent='快照建立：'+new Date(DATA.createdAt).toLocaleString('zh-TW')+'。來源SHA與版本可在下方展開核對；本包含官方答案，僅供教師本機審閱。';
for(const s of [...new Set(DATA.papers.map(p=>p.subject))])$('subject').add(new Option(s,s));
const statusOptions=['尚未確認','維持現況','維持暫停','採官方答案','依教師更正（詳註記）','待補原音或原檔'];
function fieldHtml(f){return `<div class="twocol"><section class="question"><h3>原題文字｜${esc(f.id)} <span class="small muted">${esc(f.points)}分</span></h3><div class="text">${esc(f.text)}</div><p class="small muted">原卷第${f.paperPage}頁；完整選項、圖表與注音以原頁為準。</p></section><section class="question answer"><h3>官方解答原記號</h3><div class="text">${esc(f.raw)}</div>${f.reference?`<hr><div class="small muted">目前保留的官方參考／限制</div><div class="text">${esc(f.reference)}</div>`:''}<p class="small muted">解答第${f.keyPage}頁。字跡不明或留白會如實保留，沒有猜補。</p></section></div>`;}
function groupHtml(g){return `<section>${g.material?`<div class="material">${esc(g.material)}</div>`:''}${g.prompt&&!g.fields.some(f=>f.text===g.prompt)?`<div class="text">${esc(g.prompt)}</div>`:''}${g.images.length?`<div class="figures">${g.images.map(m=>a(m.image, '開啟原題圖表')+`<img src="${esc(m.image)}" alt="${esc(m.alt)}" loading="lazy">`).join('')}</div>`:''}${g.choices.length?`<ul class="choices">${g.choices.map(c=>`<li><b>${esc(c.id)}.</b> ${esc(c.text)} ${c.images.map(m=>`<img class="choice-img" src="${esc(m)}" loading="lazy" alt="選項${esc(c.id)}原圖">`).join('')}</li>`).join('')}</ul>`:''}${g.fields.map(fieldHtml).join('')}</section>`;}
function pagesHtml(c){return `<details><summary>原題／官方解答原頁對照（${c.pages.length}頁，可放大）</summary><div class="pages">${c.pages.map(m=>`<section class="page"><strong>${m.role==='paper'?'原題':'官方解答'} 第${m.page}頁</strong> · ${a(m.pdf,'開啟PDF')} <button class="view-page" data-image="${esc(m.image)}" data-title="${esc(c.id+' '+(m.role==='paper'?'原題':'官方解答')+' p'+m.page)}">放大／旋轉</button><img loading="lazy" src="${esc(m.image)}" alt="${esc(c.paper)} ${m.role==='paper'?'原題':'官方解答'}第${m.page}頁"></section>`).join('')}</div></details>`;}
function cardHtml(c){return `<article class="card" id="${esc(c.id)}" data-card="${esc(c.id)}"><span class="tag ${c.category==='暫停・待確認'?'priority':''}">${esc(c.id)} · ${esc(c.category)}</span><span class="muted small">${esc(c.paper)}</span><h2>${esc(c.title)}</h2><p class="reason">${esc(c.reason)}</p><p class="ask">請你確認：${esc(c.ask)}</p>${c.questions.length>8?`<details><summary>逐題原文與官方解答（${c.questions.reduce((n,g)=>n+g.fields.length,0)}欄）</summary>${c.questions.map(groupHtml).join('')}</details>`:c.questions.map(groupHtml).join('')}${pagesHtml(c)}${c.related.length?`<details><summary>${c.category==='校對歷程'?'完整歷程':'相關校對紀錄'}（${c.related.length}則）</summary>${c.related.map(n=>`<div class="note"><code>${esc(n.id)} · ${esc((n.questions||[]).join('、'))}</code><p class="text">${esc(n.detail)}</p>${n.resolution?`<p>${esc(n.resolution)}</p>`:''}</div>`).join('')}</details>`:''}${c.category!=='校對歷程'?`<div class="decision"><label for="status-${c.id}">你的確認結果</label><select data-decision="${c.id}" id="status-${c.id}">${statusOptions.map(s=>`<option>${esc(s)}</option>`).join('')}</select><label for="note-${c.id}">正確答案／更正範圍／說明</label><textarea id="note-${c.id}" data-note="${c.id}" placeholder="例如：正確答案為④；採用原題不改字；只改本欄，其他維持。"></textarea></div>`:''}<details><summary>版本資訊</summary><code>${esc(c.paperId)}<br>內容SHA-256：${esc(c.bundleSha256)}</code></details></article>`;}
$('cards').innerHTML=DATA.cards.map(cardHtml).join('');
function drawTabs(){$('tabs').innerHTML=['全部',...categories].map(s=>`<button data-tab="${esc(s)}" aria-pressed="${s===selected}">${esc(s)} (${s==='全部'?DATA.cards.length:DATA.cards.filter(c=>c.category===s).length})</button>`).join('');}
const searchText=new Map(DATA.cards.map(c=>[c.id,JSON.stringify(c).toLocaleLowerCase()]));
function filter(){let shown=0;const term=$('search').value.trim().toLocaleLowerCase();for(const c of DATA.cards){const show=(selected==='全部'||c.category===selected)&&(!$('year').value||c.year===$('year').value)&&(!$('grade').value||String(c.grade)===$('grade').value)&&(!$('subject').value||c.subject===$('subject').value)&&(!term||searchText.get(c.id).includes(term))&&(!pendingOnly||!decisions.get(c.id)||decisions.get(c.id).status==='尚未確認');$(c.id).classList.toggle('hidden',!show);shown+=show;}const answered=[...decisions.values()].filter(d=>d.status!=='尚未確認'||d.note.trim()).length;$('count').textContent=`顯示 ${shown} 項 · 全部 ${DATA.cards.length} 項（含校對歷程）· 已填確認 ${answered} 項`;$('empty').hidden=shown>0;}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;selected=b.dataset.tab;drawTabs();filter();});for(const id of ['year','grade','subject','search'])$(id).addEventListener(id==='search'?'input':'change',filter);
$('pending').onclick=()=>{pendingOnly=!pendingOnly;$('pending').textContent=pendingOnly?'顯示全部確認狀態':'只看尚未填確認結果';filter();};$('resetFilters').onclick=()=>{for(const id of ['year','grade','subject','search'])$(id).value='';pendingOnly=false;$('pending').textContent='只看尚未填確認結果';selected='暫停・待確認';drawTabs();filter();};
$('cards').addEventListener('input',e=>{const id=e.target.dataset.note||e.target.dataset.decision;if(!id)return;decisions.set(id,{status:$('status-'+id).value,note:$('note-'+id).value});dirty=true;filter();});$('cards').addEventListener('change',e=>{if(e.target.dataset.decision)e.target.dispatchEvent(new Event('input',{bubbles:true}));});
let scale=1,angle=0;function zoomSize(){const img=$('zoomImage');if(!img.naturalWidth)return;const frameWidth=$('zoomFrame').clientWidth||600,quarter=angle%180!==0,w=frameWidth*scale*(quarter?img.naturalWidth/img.naturalHeight:1),h=w*img.naturalHeight/img.naturalWidth;img.style.width=w+'px';$('zoomStage').style.width=(quarter?h:w)+'px';$('zoomStage').style.height=(quarter?w:h)+'px';const offsets={0:[0,0],90:[h,0],180:[w,h],270:[0,w]};img.style.transform=`translate(${offsets[angle][0]}px,${offsets[angle][1]}px) rotate(${angle}deg)`;}$('zoomImage').onload=zoomSize;$('cards').addEventListener('click',e=>{const b=e.target.closest('.view-page');if(!b)return;$('zoomTitle').textContent=b.dataset.title;scale=1;angle=0;$('zoom').showModal();$('zoomImage').src=b.dataset.image;zoomSize();});$('closeZoom').onclick=()=>$('zoom').close();$('zoomIn').onclick=()=>{scale=Math.min(scale+.5,4);zoomSize();};$('zoomOut').onclick=()=>{scale=Math.max(scale-.5,.5);zoomSize();};$('rotate').onclick=()=>{angle=(angle+90)%360;zoomSize();};window.addEventListener('resize',()=>{if($('zoom').open)zoomSize();});
function exportData(){return {schema:'past-exam-review-decisions/1',sourceSnapshot:DATA.createdAt,exportedAt:new Date().toISOString(),decisions:[...decisions].filter(([,d])=>d.status!=='尚未確認'||d.note.trim()).map(([id,d])=>{const c=byId.get(id);return {id,paperId:c.paperId,questionIds:c.questionIds,bundleSha256:c.bundleSha256,category:c.category,...d};})};}
function download(name,type,body){const u=URL.createObjectURL(new Blob([body],{type})),link=document.createElement('a');link.href=u;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);dirty=false;}
function markdown(){const out=['# 考古題教師確認紀錄','',`來源快照：${DATA.createdAt}`,`匯出時間：${new Date().toLocaleString('zh-TW')}`,'','此檔為匯出時的教師確認紀錄。頁面不會自動更新正式題庫；須交由Codex讀取並依確認內容處理。',''];for(const d of exportData().decisions){const c=byId.get(d.id);out.push(`- [x] ${c.id}｜${c.paper}｜${d.status}`,`  - 題目：${c.questionIds.join('、')}`,`  - 確認內容：${d.note.replace(/\n/g,'\n    ')||'未填說明'}`,`  - 原卷ID：${c.paperId}`,`  - 內容SHA-256：${c.bundleSha256}`,'');for(const g of c.questions)for(const f of g.fields)out.push(`  - 原題 ${f.id}：${f.text.replace(/\n/g,' ')}`,`  - 官方原記號：${f.raw.replace(/\n/g,' ')}`);out.push('');}if(exportData().decisions.length===0)out.push('尚未填寫任何確認結果。');return out.join('\n')+'\n';}
$('export').onclick=()=>download('考古題教師確認紀錄.md','text/markdown;charset=utf-8',markdown());$('exportJson').onclick=()=>download('考古題教師確認資料.json','application/json;charset=utf-8',JSON.stringify(exportData(),null,2));
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.schema!=='past-exam-review-decisions/1'||!Array.isArray(v.decisions))throw Error('檔案格式不同');for(const d of v.decisions){const c=byId.get(d.id);if(!c||c.bundleSha256!==d.bundleSha256||c.paperId!==d.paperId||!statusOptions.includes(d.status)||typeof d.note!=='string')throw Error('題目版本或確認資料不符');}for(const d of v.decisions){decisions.set(d.id,{status:d.status,note:d.note});$('status-'+d.id).value=d.status;$('note-'+d.id).value=d.note;}dirty=false;filter();alert(`已讀回${v.decisions.length}項確認結果。`);}catch(err){alert('無法讀回：'+err.message);}};
$('sources').innerHTML=DATA.papers.map(p=>`<div class="note"><strong>${esc(p.title)}</strong><p>${esc(p.edition)}｜${esc(p.range)}</p><code>內容SHA：${esc(p.sha256)}</code>${Object.entries(p.sources).map(([role,s])=>`<p>${a(s.href,role==='paper'?'試卷PDF':'官方解答PDF')} · ${a(s.originalHref,'原始檔')}<br><code>原檔SHA：${esc(s.originalSha256)}</code></p>`).join('')}</div>`).join('');
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});drawTabs();filter();
window.__reviewQA={data:DATA,exportData,markdown,decisions};
</script></body></html>
