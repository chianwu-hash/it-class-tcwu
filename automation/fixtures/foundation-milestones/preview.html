<!doctype html><html lang="zh-Hant" data-reward-color-mode="source"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中英打里程碑・本機驗證</title>
<link rel="stylesheet" href="/shared/typing-foundation-milestones.css"><style>body{font-family:system-ui;margin:24px;background:#f7fafc;color:#243b53}main{max-width:1100px;margin:auto}.summaries{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tree{position:relative;width:544px;height:544px;max-width:100%;margin:auto;background:url('/assets/reward-tree/empty-tree-base-v1-q80.webp') center/contain no-repeat}.reward{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);transform:translate(-50%,-50%) rotate(var(--rot));border:0;cursor:pointer}.leaf{border-radius:80% 0 80% 0;background:green}.flower{background:transparent url('/assets/reward-tree/flowers/flower-sunrise.png') center/contain no-repeat}iframe{width:100%;height:740px;border:1px solid #ddd;border-radius:20px}button,select{font:inherit;padding:8px;margin:5px}#selected{min-height:25px}@media(max-width:650px){.summaries{grid-template-columns:1fr}body{margin:12px}}</style>
<main><h1>中英打里程碑・本機驗證</h1><p>使用模擬成果，不連線寫入學生資料。</p><label>花葉配色 <select id="mode"><option value="source">依練習來源：英打藍／中打紫</option><option value="custom">自選花色</option></select></label><button id="full">全部完成</button><button id="partial">尚未完成前關</button><div class="summaries" id="summaries"></div><p id="selected" role="status"></p><div class="tree" id="tree"></div><h2>第二級努力樹</h2><label>夥伴場景 <select id="pet"><option value="cat">貓咪</option><option value="dog">狗狗</option><option value="rabbit">兔子</option></select></label><iframe id="scene" title="第二級樹"></iframe><h2>成長重播</h2><iframe id="growth" title="成長重播"></iframe></main>
<script type="module">
import{FOUNDATION_TRACKS}from'/shared/typing-foundation-milestones.mjs';import{foundationTreeData}from'/shared/typing-foundation-rewards.js';import{deriveRewardTreeModel}from'/shared/reward-tree-model.js';import{renderRewardTree}from'/shared/reward-tree-renderer.js';import{LEAF_SLOTS,FLOWER_SLOTS}from'/shared/reward-tree-config.js';import{createFoundationMilestoneSummary}from'/shared/typing-foundation-milestone-ui.mjs';
const full=Object.values(FOUNDATION_TRACKS).flat().map(l=>({lesson_key:l.key,completed:true,completed_at:'2026-10-01T00:00:00Z'})),widgets=['english','zhuyin'].map(createFoundationMilestoneSummary);widgets.forEach(w=>document.querySelector('#summaries').append(w.element));let rewards=[],current=full;
function sceneData(){return{leaves:rewards.filter(r=>r.kind!=='flower'),flowers:rewards.filter(r=>r.kind==='flower'),rewardColorMode:document.documentElement.dataset.rewardColorMode,petUnlocked:false,treeSkin:'a'}}
function configure(){const api=document.querySelector('#scene').contentWindow.__gardenShelterV21;if(api?.snapshot().ready)api.configure(sceneData())}
function render(rows){current=rows;widgets.forEach(w=>w.update(rows));const d=foundationTreeData(rows,'grade3-115-1'),m=deriveRewardTreeModel(d.rows,d.activities);rewards=m.rewards;renderRewardTree({layer:document.querySelector('#tree'),leaves:rewards.filter(r=>r.kind!=='flower'),flowers:rewards.filter(r=>r.kind==='flower'),leafSlots:LEAF_SLOTS,flowerSlots:FLOWER_SLOTS,onSelect:r=>document.querySelector('#selected').textContent=r.title});configure();window.qa={model:m,rows};}
document.querySelector('#full').onclick=()=>render(full);document.querySelector('#partial').onclick=()=>render([{...full[0],completed:false},...full.slice(1)]);document.querySelector('#mode').onchange=e=>{document.documentElement.dataset.rewardColorMode=e.target.value;configure();document.querySelector('#growth').contentWindow.postMessage({type:'growth-color-mode',rewardColorMode:e.target.value},location.origin)};
document.querySelector('#pet').onchange=e=>{document.querySelector('#scene').src=e.target.value==='cat'?'/garden/scene-cat.html':'/garden/scene-pets.html?species='+e.target.value};document.querySelector('#pet').dispatchEvent(new Event('change'));
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.source===document.querySelector('#growth').contentWindow&&e.data?.type==='growth-ready')e.source.postMessage({type:'growth-state',reducedMotion:true,rewardColorMode:document.documentElement.dataset.rewardColorMode,rewards},location.origin)});
document.querySelector('#scene').onload=()=>{const timer=setInterval(()=>{const api=document.querySelector('#scene').contentWindow.__gardenShelterV21;if(api?.snapshot().ready){clearInterval(timer);configure();}},5000);setTimeout(()=>clearInterval(timer),60000)};render(full);document.querySelector('#growth').src='/garden/growth/index.html';
</script></html>
