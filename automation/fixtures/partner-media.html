<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夥伴練功・語音與畫圖原型</title><link rel="stylesheet" href="/shared/quiz-theme.css"><link rel="stylesheet" href="/shared/quiz-library.css"><link rel="stylesheet" href="/shared/partner-pilot/style.css"><link rel="stylesheet" href="/shared/partner-pilot/visual.css"><link rel="stylesheet" href="/shared/partner-pilot/focused.css"><link rel="stylesheet" href="/automation/fixtures/partner-media.css"></head><body class="quiz-skin partner-pilot"><div class="partner-content" data-stage="practice"><aside class="preview-banner"><strong>語音與畫圖・隔離原型</strong><p>模擬兩位夥伴，資料只留在當頁，重新整理會清空。尚未連接正式帳號、Supabase 或努力樹。</p><label>目前體驗身分 <select id="actor"><option value="he">小禾</option><option value="qing">小晴</option></select></label><details><summary>原型測試工具</summary><label>錄音來源 <select id="source"><option value="mic">實際麥克風（按開始後才請求）</option><option value="tone">合成音軌（不使用麥克風）</option><option value="denied">模擬未允許麥克風</option></select></label><label><input id="fail-send" type="checkbox">模擬傳送失敗</label><button id="reset" type="button">重新體驗</button></details></aside><main><section class="partner-focus"><header class="focus-team-bar"><div><h2>森林探險隊</h2><p>自己先想，也可以請夥伴陪你找下一步。</p></div><button id="open-camp" type="button">💬 共同營地 <span id="message-count"></span></button></header><article class="question-card"><p id="question-position" class="muted"></p><h2 id="question-text"></h2><form id="answer"><fieldset class="quiz-choices"><legend>選擇一個答案</legend></fieldset><button class="primary">送出答案</button></form><p id="answer-result" role="status"></p><button id="ask" type="button">🙋 問夥伴</button></article><p class="muted">可以用語音說說卡在哪一步，也能畫圖提示夥伴，再回到自己的題目試一次。</p></section></main><dialog id="media-camp" class="partner-camp-dialog" aria-labelledby="camp-title"><div class="camp-panel"><header class="camp-panel-heading"><div><p>用方便的方式，一起想</p><h2 id="camp-title">我們的共同營地</h2></div><button id="close-camp" type="button">回到答題 ×</button></header><div class="camp-scroll"><div id="messages"></div><form id="compose"><h3 id="compose-title"></h3><div class="actions media-modes" role="group" aria-label="表達方式"><button type="button" data-mode="text">打字</button><button type="button" data-mode="voice">🎙 說一段</button><button type="button" data-mode="sketch">✏️ 畫給夥伴看</button></div><section data-panel="text"><label for="message-text">留給夥伴的話（可略過）</label><textarea id="message-text" maxlength="600" placeholder="說說你已經想到哪一步。"></textarea></section><section data-panel="voice" hidden><p>點開始錄音，說完再點停止，最多30秒。</p><p id="voice-status" role="status"></p><meter id="voice-level" min="0" max="1" value="0" aria-label="麥克風音量"></meter><div class="actions"><button id="record" type="button">開始錄音</button><button id="stop" type="button" hidden>停止錄音</button><button id="cancel-record" type="button" hidden>取消這次錄音</button><button id="remove-voice" type="button" hidden>移除語音</button></div><audio id="voice-preview" controls preload="none" hidden aria-label="試聽自己的語音"></audio></section><section data-panel="sketch" hidden><div id="sketch-editor"></div><p class="muted">畫板就是預覽。畫好後按下方同一顆送出即可。</p></section><p id="attachment-summary" class="muted"></p><button id="send" class="green">送給夥伴</button><p id="send-status" role="status"></p><button id="retry" type="button" hidden>重送同一次訊息</button><button id="cancel-send" type="button" hidden>取消這次傳送，保留草稿</button></form></div></div></dialog><dialog id="sketch-dialog" aria-labelledby="sketch-title"><h2 id="sketch-title">夥伴的畫圖</h2><button id="close-sketch" type="button">關閉畫圖</button><div id="sketch-view"></div></dialog></div><script type="module" src="/automation/fixtures/partner-media.mjs"></script></body></html>
