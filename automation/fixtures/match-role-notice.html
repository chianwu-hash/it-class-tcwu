<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>組隊角色提示測試</title><link rel="stylesheet" href="/shared/partner-pilot/team-flow.css"><style>body{font-family:system-ui;background:#effbf8;color:#174b4b;margin:0;padding:24px}main{max-width:800px;margin:auto}.card{padding:24px;background:white;border-radius:24px}button{padding:12px}button,input{font:inherit}</style><main class="partner-content"><div id="root"></div></main><script type="module">
import {createMatchmaking} from '/shared/partner-pilot/matchmaking.mjs';
let state,controller;window.actions=[];
window.reset=async(host='a')=>{controller?.dispose();state={phase:'selecting',now:new Date().toISOString(),team:{id:'synthetic-team',host,revision:1,members:[{id:'a',name:'測試夥伴甲'},{id:'b',name:'測試夥伴乙'}],selected:null}};controller=createMatchmaking({root:document.querySelector('#root'),rpc:async args=>{actions.push(args.action);return args.action==='catalog'?{revision:state.team.revision,papers:[]}:structuredClone(state);},userId:'a',esc:s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;'),onExit(){},onActive:id=>{window.activeRoom=id;},onStage(){},notice(){}});await controller.start(state);};
window.update=async patch=>{Object.assign(state,patch);dispatchEvent(new Event('online'));};
window.teamUpdate=async patch=>{Object.assign(state.team,patch);state.team.revision++;dispatchEvent(new Event('online'));};
window.dispose=()=>controller.dispose();await reset();window.ready=true;
</script></html>
