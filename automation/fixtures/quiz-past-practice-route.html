<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考古錯題練習導向合成驗證</title>
<link rel="stylesheet" href="/shared/quiz-workshop/generated/library.css"><body class="quiz-skin"><main><p>本機合成驗證，不讀寫正式帳號、題目或作答。</p><section id="cloud-library"></section></main>
<script type="module">
import {initWrongQuestions} from '/shared/quiz-wrong-questions.mjs';
const params=new URLSearchParams(location.search),grade=Number(params.get('grade')||9),fault=params.get('fault')||'';
const id=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),content=text=>({text,media:[]});
window.fixtureUser='synthetic-student';window.fixtureCalls=[];
const source={source_type:'past_exam',attempt_id:id(1),question_id:'choice-01',paper_id:'synthetic-original',version_id:id(2),group_id:'choice-01'};
const item={...source,title:'合成原卷',catalog:{subject:'社會',unit:'合成學習重點'},source_label:'選擇題1',field_label:'1',answered_at:'2026-11-28T00:00:00Z',preview:'合成錯題，不含私有內容。'};
const question={id:'choice-01',type:'single',prompt:content('合成題：看到線索後，選擇符合的說明。'),material:content(''),options:[{id:'A',content:content('第一種說明')},{id:'B',content:content('第二種說明')}],answer:{option_id:'B'},explanation:content('合成固定解析。')};
const learningReview={schema:1,source:{versionId:id(2),groupId:'choice-01',questionId:'choice-01'},explanation:'合成固定解析。',concepts:[{id:'synthetic-concept',title:'合成重點',connection:'回看線索，再試兩題。',points:['比較題目條件。'],practice:{available:true,count:2,publisher:'合成出版社',schoolYear:115,subject:'社會',chapter:'合成章節'}}]};
const request=async(action,data)=>{
 window.fixtureCalls.push({action,data});
 if(action==='wrong_questions'&&data.action==='list')return {facets:[],items:[item],total:1};
 if(action==='wrong_questions'&&data.action==='detail')return {...item,question,response:'A',review:{answer:{option_id:'B'},explanation:content('合成固定解析。')},past_review:{group:{id:'choice-01',fields:[{id:'choice-01'}]},version:id(2),record:{results:[{questionId:'choice-01',correct:false}],learningReview}}};
 if(action==='past_practice'){
  let path=`/grade${grade}/115-1/quiz.html?cloud=1&learning=1&session=${id(3)}`;
  if(fault==='grade')path=`/grade${grade===3?6:3}/115-1/quiz.html?cloud=1&learning=1&session=${id(3)}`;
  if(fault==='external')path='https://other.invalid/grade9/115-1/quiz.html';
  return {url:path,sessionId:id(3),count:2};
 }
 throw Error('非預期的合成請求');
};
window.routeFixture=initWrongQuestions({request,pageGrade:grade,getUserId:()=>window.fixtureUser,externalNavigation:true});window.routeFixture.activate(true);window.fixtureReady=true;
</script></body></html>
