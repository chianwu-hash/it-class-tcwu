<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的努力樹</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14233f;
            --muted: #53647d;
            --line: rgba(20, 35, 63, 0.12);
            --panel: rgba(255, 255, 255, 0.76);
            --leaf-a: #8bd65b;
            --leaf-b: #2f9e57;
            --leaf-c: #167044;
            --quiz-a: #42d6c9;
            --quiz-b: #1f8fb4;
            --flower-image: url("assets/reward-tree/flowers/flower-sunrise.png");
        }

        :root[data-flower="ocean"] {
            --flower-image: url("assets/reward-tree/flowers/flower-ocean.png");
        }

        :root[data-flower="candy"] {
            --flower-image: url("assets/reward-tree/flowers/flower-candy.png");
        }

        :root[data-flower="forest"] {
            --flower-image: url("assets/reward-tree/flowers/flower-forest.png");
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            font-family: "Noto Sans TC", system-ui, sans-serif;
            background:
                radial-gradient(circle at 12% 12%, rgba(255, 224, 138, 0.38), transparent 28%),
                radial-gradient(circle at 86% 4%, rgba(117, 219, 202, 0.42), transparent 30%),
                linear-gradient(135deg, #fffdf4 0%, #e9f8fb 58%, #f7fff4 100%);
        }

        button,
        select {
            font: inherit;
        }

        .page {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 36px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 7vw, 4.6rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-weight: 900;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--ink);
            cursor: pointer;
            padding: 8px 16px;
            text-decoration: none;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(20, 35, 63, 0.08);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .hidden {
            display: none !important;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 272px;
            gap: 18px;
            align-items: stretch;
        }

        .tree-shell,
        .side-panel > section {
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 18px 48px rgba(35, 70, 54, 0.12);
            backdrop-filter: blur(14px);
        }

        .tree-shell {
            min-height: 720px;
            border-radius: 28px;
            padding: 24px;
        }

        .tree-stage {
            position: relative;
            min-height: 660px;
            overflow: hidden;
            border-radius: 20px;
            background:
                radial-gradient(circle at 22% 18%, rgba(164, 225, 255, 0.42), transparent 28%),
                radial-gradient(circle at 13% 83%, rgba(255, 229, 129, 0.34), transparent 30%),
                linear-gradient(180deg, rgba(243, 253, 255, 0.94), rgba(255, 255, 255, 0.82));
        }

        .tree-image {
            position: absolute;
            left: 50%;
            bottom: 2%;
            width: min(90%, 680px);
            height: auto;
            transform: translateX(-50%);
            filter: drop-shadow(0 24px 28px rgba(95, 74, 31, 0.18));
        }

        .reward-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        .reward {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--size);
            height: calc(var(--size) * 1.32);
            border: 0;
            cursor: pointer;
            transform: translate(-50%, -50%) rotate(var(--rot)) scale(0.98);
            animation: rewardPop 520ms ease-out both;
            animation-delay: calc(var(--i) * 24ms);
        }

        .reward.leaf {
            border-radius: 78% 8% 72% 12%;
            background:
                linear-gradient(138deg, rgba(255, 255, 255, 0.54), transparent 38%),
                radial-gradient(circle at 68% 72%, var(--leaf-c), transparent 34%),
                linear-gradient(135deg, var(--leaf-a), var(--leaf-b));
            box-shadow: 0 8px 16px rgba(18, 98, 61, 0.24);
        }

        .reward.leaf.quiz {
            background:
                linear-gradient(138deg, rgba(255, 255, 255, 0.58), transparent 40%),
                linear-gradient(135deg, var(--quiz-a), var(--quiz-b));
        }

        .reward.flower {
            height: var(--size);
            background: transparent var(--flower-image) center / contain no-repeat;
            filter: drop-shadow(0 9px 12px rgba(122, 55, 92, 0.24));
        }

        .reward.leaf.ghost,
        .reward.flower.ghost {
            background: transparent;
            border: 2px dashed #52776b;
            box-sizing: border-box;
            box-shadow: none;
            filter: none;
            opacity: 1;
            animation: none;
        }

        .reward.flower.ghost {
            border-radius: 50%;
            border-color: #9c6380;
        }

        .reward.ghost:hover,
        .reward.ghost:focus-visible {
            outline: 2px solid #52776b;
            outline-offset: 4px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .side-panel > section {
            border-radius: 18px;
            padding: 16px;
        }

        .label {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 900;
        }

        .course-select {
            width: 100%;
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--ink);
            padding: 10px 12px;
            font-weight: 900;
        }

        .profile-card h2,
        .detail-card h3,
        .palette-card h3 {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.25;
        }

        .profile-card p,
        .detail-card p,
        .palette-card p,
        .notice-card {
            color: var(--muted);
            font-size: 0.93rem;
            font-weight: 800;
            line-height: 1.65;
        }

        .stats-grid {
            display: grid;
            gap: 10px;
        }

        .stat {
            display: grid;
            grid-template-columns: 42px 1fr;
            gap: 10px;
            align-items: center;
        }

        .stat-mark {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            color: #10381f;
            font-size: 1.32rem;
            font-weight: 950;
            background: linear-gradient(135deg, #8bd65b, #66d4a3);
        }

        .flowers .stat-mark {
            color: #5d2a40;
            background: linear-gradient(135deg, #ffb3cc, #ffdc73);
        }

        .stat strong {
            display: block;
            font-size: 1rem;
        }

        .flower-options {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .flower-option {
            width: 38px;
            height: 38px;
            border: 2px solid transparent;
            border-radius: 50%;
            background: url("assets/reward-tree/flowers/flower-sunrise.png") center / contain no-repeat;
            cursor: pointer;
        }

        .flower-option.ocean {
            background-image: url("assets/reward-tree/flowers/flower-ocean.png");
        }

        .flower-option.candy {
            background-image: url("assets/reward-tree/flowers/flower-candy.png");
        }

        .flower-option.forest {
            background-image: url("assets/reward-tree/flowers/flower-forest.png");
        }

        .flower-option.selected {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
        }

        .flower-option:disabled {
            cursor: not-allowed;
            opacity: 0.48;
        }

        .notice-card.info {
            border-color: rgba(14, 116, 144, 0.18);
            background: rgba(236, 254, 255, 0.86);
            color: #155e75;
        }

        .notice-card.error {
            border-color: rgba(225, 29, 72, 0.18);
            background: rgba(255, 241, 242, 0.9);
            color: #be123c;
        }

        @keyframes rewardPop {
            from {
                opacity: 0;
                transform: translate(-50%, -42%) rotate(var(--rot)) scale(0.72);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(var(--rot)) scale(0.98);
            }
        }

        @media (max-width: 920px) {
            .topbar,
            .dashboard {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                justify-content: flex-start;
            }

            .tree-shell {
                min-height: 78vw;
                padding: 16px;
            }

            .tree-stage {
                min-height: 74vw;
            }
        }

        @media (max-width: 620px) {
            .page {
                width: min(100% - 20px, 1120px);
                padding-top: 18px;
            }

            .tree-shell,
            .side-panel > section {
                border-radius: 14px;
            }

            .tree-stage {
                min-height: 105vw;
            }

            .tree-image {
                width: 112%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .reward {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div>
                <h1>我的努力樹</h1>
                <p id="subtitle" class="subtitle">登入後讀取自己的闖關成果</p>
            </div>
            <div class="actions">
                <button class="btn" id="back-page-btn" type="button">回上頁</button>
                <a class="btn" id="course-home-link" href="/grade3/index.html">回課程首頁</a>
                <button class="btn" id="login-btn" type="button">Google 登入</button>
                <button class="btn hidden" id="logout-btn" type="button">登出</button>
            </div>
        </header>

        <section class="dashboard">
            <article class="tree-shell" aria-label="努力樹">
                <div class="tree-stage">
                    <img class="tree-image" src="assets/reward-tree/empty-tree-base-v1-q80.webp" width="1254" height="1254" alt="努力樹">
                    <div id="reward-layer" class="reward-layer" aria-live="polite"></div>
                </div>
            </article>

            <aside class="side-panel" aria-label="努力樹資訊">
                <section class="profile-card">
                    <p class="label">目前課程</p>
                    <select id="course-select" class="course-select" aria-label="選擇課程"></select>
                    <h2 id="profile-title">尚未登入</h2>
                    <p id="profile-meta">請先登入 Google，努力樹才會讀取自己的進度。</p>
                </section>

                <section class="stats-grid" aria-label="努力樹統計">
                    <div class="stat leaves">
                        <div class="stat-mark" id="leaf-count">0</div>
                        <div>
                            <p class="label">葉子</p>
                            <strong id="leaf-text">尚未讀取</strong>
                        </div>
                    </div>
                    <div class="stat flowers">
                        <div class="stat-mark" id="flower-count">0</div>
                        <div>
                            <p class="label">花朵</p>
                            <strong id="flower-text">完成魔王關</strong>
                        </div>
                    </div>
                </section>

                <section class="palette-card" aria-label="花色選擇">
                    <h3>花色</h3>
                    <p id="palette-status">完成 3 朵花後，可以選擇花色。</p>
                    <div class="flower-options">
                        <button class="flower-option selected" type="button" data-flower="sunrise" aria-label="粉橘花"></button>
                        <button class="flower-option ocean" type="button" data-flower="ocean" aria-label="藍色花"></button>
                        <button class="flower-option candy" type="button" data-flower="candy" aria-label="粉紫花"></button>
                        <button class="flower-option forest" type="button" data-flower="forest" aria-label="綠色花"></button>
                    </div>
                </section>

                <section class="detail-card">
                    <h3 id="detail-title">選一片葉子或一朵花</h3>
                    <p id="detail-text">點選獎勵可以看它代表哪一個任務。</p>
                </section>

                <section id="notice-card" class="notice-card hidden"></section>
            </aside>
        </section>
    </main>

    <script type="module">
        import {
            resolveSession,
            signInWithGoogle,
            signOutAndReload,
            supabase
        } from "./shared/auth.js";
        import {
            DEFAULT_COURSE_ID,
            COURSE_DEFINITIONS,
            getCourseDefinition,
            inferCourseIdFromPath,
            normalizeCourseId
        } from "./shared/course-context.js";
        import {
            DEFAULT_REWARD_TREE_COURSE_ID,
            FLOWER_SLOTS,
            LEAF_SLOTS,
            getRewardTreeCourse,
            getRewardTreeCourses
        } from "./shared/reward-tree-config.js";
        import { createFullCompletionRows, deriveRewardTreeModel } from "./shared/reward-tree-model.js";
        import { renderRewardTree, selectReward } from "./shared/reward-tree-renderer.js";

        const subtitleEl = document.getElementById("subtitle");
        const courseHomeLinkEl = document.getElementById("course-home-link");
        const backPageBtn = document.getElementById("back-page-btn");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const courseSelectEl = document.getElementById("course-select");
        const profileTitleEl = document.getElementById("profile-title");
        const profileMetaEl = document.getElementById("profile-meta");
        const rewardLayerEl = document.getElementById("reward-layer");
        const leafCountEl = document.getElementById("leaf-count");
        const flowerCountEl = document.getElementById("flower-count");
        const leafTextEl = document.getElementById("leaf-text");
        const flowerTextEl = document.getElementById("flower-text");
        const paletteStatusEl = document.getElementById("palette-status");
        const detailTitleEl = document.getElementById("detail-title");
        const detailTextEl = document.getElementById("detail-text");
        const noticeCardEl = document.getElementById("notice-card");
        const flowerOptions = Array.from(document.querySelectorAll(".flower-option"));
        const query = new URLSearchParams(window.location.search);
        const mockMode = query.get("mock") === "full";
        const COURSE_STORAGE_KEY = "reward-tree-course-id";
        const FLOWER_STORAGE_KEY = "reward-tree-flower-style";

        let currentSession = null;
        let selectedCourseId = resolveInitialCourseId();

        function referrerCourseId() {
            try {
                if (!document.referrer) return null;
                const url = new URL(document.referrer);
                if (url.origin !== window.location.origin) return null;
                return inferCourseIdFromPath(url.pathname);
            } catch {
                return null;
            }
        }

        function resolveInitialCourseId() {
            const fromQuery = query.get("course");
            const fromReferrer = referrerCourseId();
            const fromStorage = window.sessionStorage.getItem(COURSE_STORAGE_KEY);
            return normalizeCourseId(fromQuery || fromReferrer || fromStorage || DEFAULT_REWARD_TREE_COURSE_ID || DEFAULT_COURSE_ID);
        }

        function showNotice(message, tone = "info") {
            noticeCardEl.textContent = message;
            noticeCardEl.className = `notice-card ${tone}`;
        }

        function hideNotice() {
            noticeCardEl.className = "notice-card hidden";
            noticeCardEl.textContent = "";
        }

        function updateCourseUrl() {
            const url = new URL(window.location.href);
            url.searchParams.set("course", selectedCourseId);
            if (mockMode) {
                url.searchParams.set("mock", "full");
            }
            window.history.replaceState(null, "", url);
        }

        function updateCourseChrome() {
            const course = getCourseDefinition(selectedCourseId);
            subtitleEl.textContent = `${course.label} 的闖關成果`;
            courseHomeLinkEl.href = course.homeHref;
        }

        function initCourseSelect() {
            const configuredCourseIds = new Set(getRewardTreeCourses().map((course) => course.id));
            const courses = COURSE_DEFINITIONS.filter((course) => configuredCourseIds.has(course.id));
            courseSelectEl.innerHTML = courses.map((course) => (
                `<option value="${course.id}">${course.label}</option>`
            )).join("");
            courseSelectEl.value = selectedCourseId;
        }

        function setFlowerStyle(style) {
            const safeStyle = ["sunrise", "ocean", "candy", "forest"].includes(style) ? style : "sunrise";
            document.documentElement.dataset.flower = safeStyle;
            flowerOptions.forEach((option) => {
                option.classList.toggle("selected", option.dataset.flower === safeStyle);
            });
            window.localStorage.setItem(FLOWER_STORAGE_KEY, safeStyle);
        }

        function updateAuthUi() {
            const email = currentSession?.user?.email || "";
            loginBtn.classList.toggle("hidden", !!email);
            logoutBtn.classList.toggle("hidden", !email);
            profileTitleEl.textContent = email || "尚未登入";
            profileMetaEl.textContent = email
                ? `${getCourseDefinition(selectedCourseId).label}，已讀取自己的進度。`
                : "請先登入 Google，努力樹才會讀取自己的進度。";
        }

        function isMissingCourseIdError(error) {
            const message = String(error?.message || error?.details || error || "").toLowerCase();
            return message.includes("course_id")
                && (message.includes("does not exist") || message.includes("schema cache") || message.includes("column"));
        }

        async function loadProgressRows() {
            if (mockMode) {
                return createFullCompletionRows(getRewardTreeCourse(selectedCourseId).activities);
            }

            if (!currentSession?.user) {
                return [];
            }

            let { data, error } = await supabase
                .from("student_progress")
                .select("course_id,week_code,activity_key,current_level,completed,score,updated_at")
                .eq("user_id", currentSession.user.id)
                .eq("course_id", selectedCourseId);

            if (error && isMissingCourseIdError(error)) {
                ({ data, error } = await supabase
                    .from("student_progress")
                    .select("week_code,activity_key,current_level,completed,score,updated_at")
                    .eq("user_id", currentSession.user.id));

                if (!error) {
                    const allowedActivities = new Set(
                        getRewardTreeCourse(selectedCourseId).activities
                            .map((activity) => `${activity.weekCode}:${activity.activityKey}`)
                    );
                    return (data || [])
                        .filter((row) => allowedActivities.has(`${row.week_code}:${row.activity_key}`))
                        .map((row) => ({
                            ...row,
                            course_id: selectedCourseId
                        }));
                }
            }

            if (error) {
                throw error;
            }

            return data || [];
        }

        function renderEmptyCourse(course) {
            renderRewardTree({
                layer: rewardLayerEl,
                leaves: [],
                flowers: [],
                pendingLeaves: [],
                pendingFlowers: [],
                leafSlots: LEAF_SLOTS,
                flowerSlots: FLOWER_SLOTS,
                onSelect: (reward) => selectReward(reward, detailTitleEl, detailTextEl),
                ghostLeafCount: 0,
                ghostFlowerCount: 0
            });
            leafCountEl.textContent = "0";
            flowerCountEl.textContent = "0";
            leafTextEl.textContent = "尚未設定任務";
            flowerTextEl.textContent = "等待課程開放";
            paletteStatusEl.textContent = "這門課的努力樹任務還在準備。";
            detailTitleEl.textContent = `${course.label} 準備中`;
            detailTextEl.textContent = "這門課目前還沒有放進努力樹的闖關任務。";
            flowerOptions.forEach((option) => {
                option.disabled = true;
            });
        }

        function renderModel(model, activities) {
            renderRewardTree({
                layer: rewardLayerEl,
                leaves: model.leaves,
                flowers: model.flowers,
                pendingLeaves: model.pendingLeaves,
                pendingFlowers: model.pendingFlowers,
                leafSlots: LEAF_SLOTS,
                flowerSlots: FLOWER_SLOTS,
                onSelect: (reward) => selectReward(reward, detailTitleEl, detailTextEl),
                ghostLeafCount: activities.length ? 8 : 0,
                ghostFlowerCount: activities.length ? 2 : 0
            });

            leafCountEl.textContent = String(model.stats.leafCount);
            flowerCountEl.textContent = String(model.stats.flowerCount);
            leafTextEl.textContent = model.stats.leafCount ? "一般關卡與測驗" : "尚未取得";
            flowerTextEl.textContent = model.stats.flowerCount ? "已累積花朵" : "完成魔王關";
            paletteStatusEl.textContent = model.stats.colorUnlocked
                ? "已解鎖，這次瀏覽可以更換花色。"
                : `再完成 ${model.stats.nextFlowerUnlock} 朵花，可以解鎖換色。`;

            flowerOptions.forEach((option) => {
                option.disabled = !model.stats.colorUnlocked;
            });

            if (!model.rewards.length && model.pendingRewards.length) {
                const firstPending = model.pendingRewards[0];
                detailTitleEl.textContent = "第一片葉子正在等你";
                detailTextEl.textContent = `${firstPending.reason} ${firstPending.detail}`;
            } else if (!model.rewards.length) {
                detailTitleEl.textContent = "選一片葉子或一朵花";
                detailTextEl.textContent = "點選獎勵可以看它代表哪一個任務。";
            } else {
                selectReward(model.rewards[model.rewards.length - 1], detailTitleEl, detailTextEl);
            }

            if (model.stats.unknownRowCount > 0) {
                showNotice(`有 ${model.stats.unknownRowCount} 筆進度尚未放進這門課的努力樹設定。`, "info");
            }
        }

        async function loadAndRender() {
            hideNotice();
            updateCourseChrome();
            updateAuthUi();

            const course = getRewardTreeCourse(selectedCourseId);
            const activities = course.activities || [];
            if (!activities.length) {
                renderEmptyCourse(course);
                return;
            }

            try {
                const rows = await loadProgressRows();
                const model = deriveRewardTreeModel(rows, activities);
                renderModel(model, activities);
            } catch (error) {
                console.error("reward tree load failed", error);
                showNotice(`讀取努力樹失敗：${error.message}`, "error");
            }
        }

        backPageBtn.addEventListener("click", () => {
            let canUseReferrer = false;
            try {
                canUseReferrer = document.referrer
                    && new URL(document.referrer).origin === window.location.origin;
            } catch {
                canUseReferrer = false;
            }

            if (canUseReferrer) {
                window.history.back();
                return;
            }

            window.location.href = "/";
        });

        loginBtn.addEventListener("click", () => {
            signInWithGoogle({ redirectTo: window.location.href });
        });
        logoutBtn.addEventListener("click", signOutAndReload);
        courseSelectEl.addEventListener("change", () => {
            selectedCourseId = normalizeCourseId(courseSelectEl.value);
            window.sessionStorage.setItem(COURSE_STORAGE_KEY, selectedCourseId);
            updateCourseUrl();
            loadAndRender();
        });
        flowerOptions.forEach((option) => {
            option.addEventListener("click", () => setFlowerStyle(option.dataset.flower));
        });

        initCourseSelect();
        updateCourseUrl();
        setFlowerStyle(window.localStorage.getItem(FLOWER_STORAGE_KEY));
        currentSession = await resolveSession();
        await loadAndRender();
    </script>
