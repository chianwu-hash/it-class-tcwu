    <script type="module">
        import {
            consumePendingRedirect,
            getHomeRedirectUrl,
            getSession,
            isTeacher,
            signInWithGoogle,
            signOutAndReload,
            supabase
        } from "./shared/auth.js";

        const authStatusEl = document.getElementById("site-auth-status");
        const adminBtn = document.getElementById("site-admin-btn");
        const loginBtn = document.getElementById("site-login-btn");
        const logoutBtn = document.getElementById("site-logout-btn");
        function updateAuthUI(session) {
            if (session?.user) {
                authStatusEl.textContent = session.user.email || "Google 使用者";
                loginBtn.classList.add("hidden");
                logoutBtn.classList.remove("hidden");
                adminBtn.classList.toggle("hidden", !isTeacher(session));
            } else {
                authStatusEl.textContent = "未登入";
                loginBtn.classList.remove("hidden");
                logoutBtn.classList.add("hidden");
                adminBtn.classList.add("hidden");
            }
        }

        async function startHomeLogin() {
            const { error } = await signInWithGoogle({
                redirectTo: getHomeRedirectUrl()
            });

            if (error) {
                console.error("Home login failed", error);
            }
        }

        loginBtn.addEventListener("click", startHomeLogin);
        logoutBtn.addEventListener("click", signOutAndReload);

        const { session } = await getSession();
        updateAuthUI(session);
        if (session) {
            consumePendingRedirect(getHomeRedirectUrl());
        } else {
            const params = new URLSearchParams(window.location.search);
            if (params.get("login") === "1") {
                await startHomeLogin();
            }
        }

        supabase.auth.onAuthStateChange((_event, nextSession) => {
            updateAuthUI(nextSession);
            if (nextSession) {
                consumePendingRedirect(getHomeRedirectUrl());
            }
        });
    </script>
