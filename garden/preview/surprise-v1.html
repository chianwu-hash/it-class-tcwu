<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>努力樹・偷偷散步小插曲</title>
<style>*{box-sizing:border-box}body{margin:0;color:#24493c;background:linear-gradient(120deg,#fff7dd,#e9f8f2);font:16px/1.6 system-ui,"Microsoft JhengHei"}main{max-width:940px;margin:auto;padding:16px}h1{font-size:1.5rem;margin:0}p{margin:6px 0}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}button,select{font:inherit;border:1px solid #9bc6b4;border-radius:12px;padding:10px;background:white;color:inherit;min-height:44px}button{background:#177767;color:white;cursor:pointer}button:disabled{opacity:.5}iframe{display:block;width:100%;height:1000px;border:0;border-radius:20px;background:#eff8f2}small{color:#536e63}main{display:grid;grid-template-columns:250px minmax(0,min(800px,calc((100dvh - 100px)*800/760)));gap:12px 20px;max-width:1200px;align-content:start}main>h1,main>p,main>small,main>.bar{grid-column:1}.bar{flex-direction:column;align-items:flex-start;margin:0}iframe{grid-column:2;grid-row:1/8;align-self:start}@media(max-width:900px){main{display:block}.bar{flex-direction:row;align-items:center;margin:12px 0}}
</style>
<main><h1>偷偷散步，被發現了！</h1><p>本機動畫示範：窩前散步 → 驚訝 → 加快回窩 → 繼續休息。</p><small>這裡每次按下都示範；學生實際進入頁面時只有五分之一機率。不連正式帳號、不改學習成果。</small>
<div class="bar"><label>夥伴 <select id="pet"><option value="cat">橘寶</option><option value="dog">布丁</option><option value="rabbit">蹦蹦</option></select></label><label>天氣 <select id="weather"><option value="day">晴天</option><option value="downpour">大雨</option><option value="thunder">雷雨</option></select></label><label>小窩 <select id="home"><option value="default">選定款式</option><option value="a">款式 A</option><option value="b">款式 B</option><option value="c">款式 C</option></select></label><label>樹型 <select id="tree"><option value="a">舒展大樹</option><option value="b">層層大樹</option></select></label><button id="replay" disabled>再看一次</button></div><p id="status" role="status">正在準備花園…</p><iframe id="stage" src="/garden/stage.html" title="寵物偷偷散步動畫"></iframe></main>
<script type="module">
const f=document.getElementById('stage'),$=id=>document.getElementById(id),defaults={cat:'b',dog:'a',rabbit:'b'};let pending=true;
const query=new URLSearchParams(location.search);for(const id of ['pet','weather','home','tree'])if([...$(id).options].some(o=>o.value===query.get(id)))$(id).value=query.get(id);
const state=()=>({petUnlocked:true,pet:$('pet').value,home:$('home').value==='default'?defaults[$('pet').value]:$('home').value,homeVisible:true,petMode:'rest',treeSkin:$('tree').value,leaves:Array.from({length:48},(_,i)=>({id:'preview-leaf-'+i,kind:'leaf',demo:true})),flowers:Array.from({length:10},(_,i)=>({id:'preview-flower-'+i,kind:'flower',demo:true}))});
function configure(){const a=f.contentWindow.__gardenScene;if(!a)return;pending=true;$('replay').disabled=true;a.setAtmosphere($('weather').value,true);a.configure(state());if(a.snapshot().ready)a.retry()}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow)return;if(e.data?.type==='garden-ready'){const style=f.contentDocument.createElement('style');style.textContent='.weather,.controls>small{display:none!important}';f.contentDocument.head.append(style);const a=f.contentWindow.__gardenScene;if(!a.__previewWeather){a.__previewWeather=a.setAtmosphere.bind(a);a.setAtmosphere=()=>a.__previewWeather($('weather').value,true)}configure();}if(e.data?.type==='garden-height')f.style.height=e.data.height+'px';if(e.data?.type==='garden-scene-ready'){
 const a=f.contentWindow.__gardenScene;a.setAtmosphere($('weather').value,true);if(pending){pending=false;const s=a.snapshot();const r=s.surprise&&['stroll','surprise','handoff','returning'].includes(s.surprise.phase)?{ok:true}:a.demo('surprise');$('status').textContent=r?.ok?'看看牠發現你之後會怎麼做！':'動作圖片尚未準備好。'}if(query.has('test'))a.pause();else a.play();$('replay').disabled=false;
}});
for(const id of ['pet','home'])$(id).onchange=configure;
$('weather').onchange=()=>f.contentWindow.__gardenScene.setAtmosphere($('weather').value,true);
$('tree').onchange=()=>f.contentWindow.__gardenScene.changeTreeSkin($('tree').value);
$('replay').onclick=()=>{pending=true;$('replay').disabled=true;f.contentWindow.__gardenScene.retry()};
window.__surprisePreview={frame:f,configure};
</script></html>
