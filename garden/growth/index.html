<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>努力樹的成長紀念</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#254d43;background:#eef8f4;font-family:system-ui,"Microsoft JhengHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #b7d7cb;border-radius:16px;background:#fff;padding:12px 20px;color:#24594a;font-weight:700}button:hover{background:#e7f6ef}button:focus-visible,input:focus-visible{outline:3px solid #b57815;outline-offset:4px}button:disabled{opacity:.5;cursor:default}.primary{background:#167461;color:#fff;border-color:#167461}.primary:hover{background:#0b5c4b}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 4vw;background:#ffffffd9;border-bottom:1px solid #d5e8df}header strong{font-size:19px}header small{color:#61796f}.shell{max-width:1240px;margin:auto;padding:18px 26px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:center}.garden{min-width:0;border:1px solid #d1e8dc;border-radius:32px;overflow:hidden;background:radial-gradient(ellipse at 50% 16%,#fffdf2,#edf8f5 70%);position:relative;box-shadow:0 12px 50px #2a6d4f0b}canvas{display:block;width:100%;height:auto;max-height:calc(100dvh - 138px);object-fit:contain}.caption{position:absolute;top:16px;left:12px;right:12px;text-align:center;font-size:clamp(15px,1.7vw,22px);font-weight:700;color:#335e48;text-shadow:0 1px 8px white;pointer-events:none}.side{display:grid;gap:18px}.eyebrow{font-size:13px;letter-spacing:.15em;color:#698575}h1{font-size:30px;margin:8px 0;line-height:1.4}p{line-height:1.8;margin:0}.muted{color:#61786e;font-size:14px}.counts{display:flex;gap:10px}.count{background:#fff;border:1px solid #d9e6db;border-radius:18px;padding:14px;flex:1}.count strong{font-size:29px;display:block;color:#327154}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .primary{flex:1;min-width:160px}.progress{height:5px;background:#dcebe2;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#619779}label{font-size:14px;display:flex;gap:9px;align-items:center}.note{padding:12px 14px;border:1px dashed #bbd5c5;border-radius:14px;font-size:13px;color:#61756b}dialog{border:1px solid #bcd8c9;border-radius:24px;max-width:min(520px,90vw);color:#254d43}dialog::backdrop{background:#173d3455}dialog ul{max-height:50vh;overflow:auto;line-height:2}#error{color:#9e3333}footer{max-width:1240px;padding:0 26px 16px;margin:auto;font-size:12px;color:#718579}@media(max-width:760px){header{padding:12px 16px}header small{font-size:11px}.shell{grid-template-columns:1fr;padding:12px;gap:14px}.side{gap:12px}.garden{border-radius:23px}canvas{max-height:none}.caption{font-size:15px;top:12px}h1{font-size:24px}.counts{max-width:340px}.side .intro{display:none}.side{grid-template-columns:1fr}.count{padding:9px 14px}.count strong{display:inline;font-size:23px;margin-right:8px}footer{padding:4px 16px 16px}}
</style></head><body>
<header><strong>🌳 努力樹的成長紀念</strong><small>我的成長紀念</small></header>
<main class="shell"><section class="garden" aria-label="努力樹成長畫面"><canvas id="scene" width="800" height="760" role="img" aria-label="保留原有花葉的第一級努力樹"></canvas><div class="caption" id="caption">每一次練習，都讓努力樹慢慢長大。</div></section>
<section class="side"><div><span class="eyebrow" id="stage">第一級 → 第二級</span><h1 id="heading">準備迎接長大的樹</h1><p class="intro muted">每一片葉、每一朵花，<br>都是一路練習留下的足跡。</p></div>
<div class="counts"><div class="count"><strong>44</strong>片葉</div><div class="count"><strong>10</strong>朵花</div></div>
<p id="message" aria-live="polite">正在準備成長紀念……</p><div class="progress" aria-hidden="true"><span id="bar"></span></div>
<div class="actions"><button class="primary" id="play" disabled>看看努力樹的變化</button><button id="pause" disabled>暫停</button><button id="skip" disabled>直接看大樹</button></div>
<label><input type="checkbox" id="reduce">減少動態</label><button id="sources">查看保留下來的花葉</button><p id="error" role="alert"></p><div class="note">這是你的成長紀念。重播不會改變成果或重複領取獎勵。</div>
</section></main><footer>成長後的空枝位置，留給接下來的練習。這段只展示努力樹的成長。</footer>
<dialog id="details"><h2>每一份成果都保留著</h2><p>原有的每一份成果都保留在努力樹上。</p><ul id="list"></ul><button id="close">回到努力樹</button></dialog>
<script type="module" src="growth.mjs"></script></body></html>
