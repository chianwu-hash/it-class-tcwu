<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的努力樹</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#f0f8f2;color:#295a4a;font:15px/1.6 system-ui,"Microsoft JhengHei",sans-serif}#scene-wrap{position:relative;width:100%;aspect-ratio:800/760}#garden-scene{display:block;width:100%;height:100%;border:0;border-radius:12px}.controls{padding:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:10px;border:1px solid #a4cdbb;border-radius:12px;background:white;color:#245b4a;min-height:44px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #be841f;outline-offset:3px}.weather{padding:10px 14px;font-size:.85rem}.weather p{margin:3px 0}.weather a{color:inherit}[hidden]{display:none!important}</style></head>
<body><div id="scene-wrap"><iframe id="garden-scene" title="努力樹與陪伴寵物"></iframe></div>
<div id="scene-load-status" role="status" aria-live="polite" hidden style="margin:8px;padding:12px;border:1px solid #cfdbb5;border-radius:12px;background:#fffbea"><span id="scene-load-message"></span> <button id="scene-retry" type="button" hidden>重新讀取</button></div>
<div class="controls"><button id="motion-toggle" type="button">暫停動畫</button><label><input id="motion-reduce" type="checkbox" aria-describedby="motion-help">省略動畫過程</label><button id="thunder-sound" type="button" aria-pressed="false" hidden>開啟雷聲</button><button id="pet-tap" type="button" hidden>和夥伴打招呼</button><small id="motion-help" style="flex-basis:100%;color:#58776d">直接顯示結果，省略走路、成長和閃電等動畫。</small></div>
<div class="weather"><strong id="location-label">頂溪國小・新北市永和區</strong> <span id="local-clock"></span> <span id="live-weather"></span><p id="location-message"></p><p id="weather-message"></p><small>依瀏覽器授權使用概略位置；未允許或定位失敗時使用學校位置。天氣資料：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></small></div>
